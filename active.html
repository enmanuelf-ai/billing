<!DOCTYPE html>

<head>

<title>My Active Youth</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #F0F2F8; color: #0f1729; min-height: 100vh; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

  .header { background: #fff; border-bottom: 1px solid #e4e8f0; padding: 18px 32px; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .header-center { text-align: center; }
  .header-brand { font-size: 0.75rem; font-weight: 800; color: #1a3a8f; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .header-brand svg { width: 20px; height: 20px; }
  .header-greeting { font-size: 1.6rem; font-weight: 800; color: #0f1729; letter-spacing: -0.02em; }

  .kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px 32px 0; max-width: 1400px; margin: 0 auto; }

  .kpi-icon.blue { background: #EEF2FF; } .kpi-icon.green { background: #EDFCF2; } .kpi-icon.purple { background: #F5F0FF; } .kpi-icon.orange { background: #FFF7ED; }
  .kpi-text { flex: 1; min-width: 0; }
  .kpi-label { font-size: 0.68rem; font-weight: 700; color: #7a86a0; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
  .kpi-value { font-size: 1.8rem; font-weight: 800; color: #0f1729; line-height: 1; }

  .kpi-card.blue .kpi-bar-bg { background: #EEF2FF; } .kpi-card.blue .kpi-bar-fg { background: #1a3a8f; width: 70%; }
  .kpi-card.green .kpi-bar-bg { background: #EDFCF2; } .kpi-card.green .kpi-bar-fg { background: #16a34a; width: 60%; }
  .kpi-card.purple .kpi-bar-bg { background: #F5F0FF; } .kpi-card.purple .kpi-bar-fg { background: #7c3aed; width: 35%; }
  .kpi-card.orange .kpi-bar-bg { background: #FFF7ED; } .kpi-card.orange .kpi-bar-fg { background: #ea580c; width: 25%; }
  .cards-list { padding: 16px 32px 40px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .empty { text-align: center; color: #7a86a0; padding: 40px 0; font-size: 0.9rem; }
  .youth-card { background: #fff; border-radius: 14px; border: 1px solid #e4e8f0; border-left: 4px solid #1a3a8f; overflow: hidden; }
  .card-main { display: grid; grid-template-columns: 1fr 1fr 1fr 200px; }
  .card-middle-row { display: contents; }

  .card-auth { padding: 20px 24px; border-right: 1px solid #f0f3f8; min-width: 0; }
  .card-cm { padding: 20px 24px; border-right: 1px solid #f0f3f8; min-width: 0; }
  .card-actions { padding: 16px 14px; display: flex; flex-direction: column; gap: 7px; justify-content: center; background: #fafbff; min-width: 0; }
  .status-badge { display: inline-block; background: #EDFCF2; color: #16a34a; font-size: 0.68rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .youth-name { font-size: 1.2rem; font-weight: 800; color: #0f1729; line-height: 1.2; margin-bottom: 6px; }
  .youth-parent { font-size: 0.78rem; color: #4a5568; margin-bottom: 6px; font-weight: 500; }
  .youth-meta { font-size: 0.8rem; color: #7a86a0; margin-bottom: 8px; font-weight: 500; }
  .youth-address { font-size: 0.8rem; color: #4a5568; margin-bottom: 8px; line-height: 1.5; }
  .youth-caseid { font-size: 0.76rem; color: #7a86a0; }

  .section-label { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; color: #1a3a8f; text-transform: uppercase; margin-bottom: 14px; }
  .auth-top { display: flex; align-items: center; gap: 20px; }
  .auth-circle-wrap { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
  .auth-ring { width: 90px; height: 90px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #f0f3f8; stroke-width: 7; }
  .ring-fg { fill: none; stroke: #16a34a; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease, stroke 0.5s ease; }
  .auth-days-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
  .days-num { font-size: 1.5rem; font-weight: 800; color: #16a34a; display: block; line-height: 1; }

  .auth-details { display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 0; }
  .auth-row { display: flex; flex-direction: column; }
  .auth-row-label { font-size: 0.62rem; color: #a0aab8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .auth-row-value { font-size: 0.95rem; font-weight: 700; color: #0f1729; }
  .auth-row-value.green { color: #16a34a; }
  .cm-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-width: 0; }
  .cm-avatar { width: 38px; height: 38px; border-radius: 50%; background: #e0e7f7; color: #1a3a8f; font-size: 0.8rem; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cm-name { font-size: 0.9rem; font-weight: 700; color: #0f1729; word-break: break-word; }
  .cm-agency { font-size: 0.74rem; color: #7a86a0; }
  .cm-contact { font-size: 0.78rem; color: #4a5568; display: flex; align-items: flex-start; gap: 6px; margin-bottom: 6px; min-width: 0; }
  .cm-contact span { flex-shrink: 0; }
  .cm-contact a { color: #4a5568; text-decoration: none; word-break: break-all; overflow-wrap: anywhere; flex: 1; min-width: 0; }
  .btn { display: block; text-align: center; padding: 10px 8px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; text-decoration: none; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: opacity .15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #1a3a8f; color: #fff; }
  .btn-schedule { background: #16a34a; color: #fff; }
  .btn-nav { background: #f0f4ff; color: #1a3a8f; border: 1px solid #c7d2f0; }
  .btn-family { background: #edfcf2; color: #15803d; border: 1px solid #bbf7d0; }
  .btn-cm { background: #faf0ff; color: #7c3aed; border: 1px solid #ddd6fe; }
  .btn-confirm { background: #16a34a; color: #fff; width: 100%; margin-bottom: 8px; padding: 12px; font-size: 0.9rem; }
  .btn-cancel-schedule { background: #f0f3f8; color: #6b7a9a; width: 100%; padding: 10px; font-size: 0.82rem; font-weight: 600; }
  .btn-cal { width: 100%; margin-bottom: 8px; padding: 11px; font-size: 0.85rem; background: #fff; color: #15803d; border: 1px solid #bbf7d0; }
  .schedule-form { border-top: 1px solid #f0f3f8; background: #f8fff8; display: none; }
  .schedule-form-inner { padding: 20px 24px; }
  .schedule-title { font-size: 0.9rem; font-weight: 800; color: #16a34a; margin-bottom: 4px; }
  .schedule-youth { font-size: 0.8rem; color: #6b7a9a; margin-bottom: 16px; }
  .schedule-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .schedule-field label { display: block; font-size: 0.68rem; font-weight: 700; color: #9aa5bc; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .schedule-field input, .schedule-field select { width: 100%; padding: 10px 12px; border: 1px solid #e4e8f0; border-radius: 8px; font-size: 0.88rem; font-family: 'Inter', sans-serif; color: #0f1729; outline: none; background: #fff; }
  .schedule-status { font-size: 0.82rem; margin-top: 10px; text-align: center; font-weight: 600; }
  .cal-links { display: none; margin-top: 8px; }
  .card-referral-bar { border-top: 1px solid #f0f3f8; }
  .referral-toggle { width: 100%; background: none; border: none; padding: 11px 24px; text-align: left; font-size: 0.78rem; font-weight: 600; color: #1a3a8f; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; }
  .ref-arrow { display: inline-block; transition: transform .2s; font-size: 0.65rem; }
  .referral-body { padding: 16px 24px 20px; display: none; background: #fafbff; border-top: 1px solid #f0f3f8; }
  .ref-title { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; color: #a0aab8; text-transform: uppercase; margin-bottom: 8px; }
  .ref-content { font-size: 0.82rem; color: #4a5568; line-height: 1.7; white-space: pre-wrap; }
  @media (max-width: 1024px) {
    .kpi-strip { grid-template-columns: repeat(2,1fr); padding: 16px 20px 0; }
    .cards-list { padding: 16px 20px 40px; }
    .card-main { grid-template-columns: 1fr 1fr; }
    .card-left { border-bottom: 1px solid #f0f3f8; }
    .card-auth { border-right: none; border-bottom: 1px solid #f0f3f8; }
  }
  @media (max-width: 600px) {
    .header { padding: 14px 16px; }
    .header-greeting { font-size: 1.2rem; }
    .header-quote { font-size: 0.82rem; }
    .kpi-strip { grid-template-columns: repeat(2,1fr); padding: 12px 12px 0; gap: 8px; }
    .cards-list { padding: 12px 12px 40px; }
    .card-main { grid-template-columns: 1fr; }
    .card-middle-row { display: grid; grid-template-columns: 1fr 1fr; min-width: 0; }
    .card-left { border-right: none; border-bottom: 1px solid #f0f3f8; }
    .card-auth { border-right: 1px solid #f0f3f8; border-bottom: 1px solid #f0f3f8; padding: 14px; }
    .card-cm { border-right: none; border-bottom: 1px solid #f0f3f8; padding: 14px; }
    .card-actions { flex-direction: row; flex-wrap: wrap; gap: 8px; padding: 14px; }
    .btn-primary, .btn-schedule { flex: 0 0 100%; }
    .btn-nav, .btn-family, .btn-cm { flex: 1 1 45%; }
    .auth-circle-wrap, .auth-ring { width: 65px; height: 65px; }
    .days-num { font-size: 1.1rem; }
    .auth-top { gap: 10px; }
    .cm-contact { font-size: 0.68rem; }
    .cm-name { font-size: 0.82rem; }
    .section-label { font-size: 0.6rem; }
    .auth-row-value { font-size: 0.82rem; }
    .schedule-fields { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="login" class="login-wrap">
  <div class="login-card">
    <svg viewBox="0 0 40 40" fill="none"><circle cx="14" cy="14" r="7" fill="#1a3a8f"/><circle cx="26" cy="14" r="7" fill="#3b5fc0"/><path d="M4 36c0-5.523 4.477-10 10-10h12c5.523 0 10 4.477 10 10" stroke="#1a3a8f" stroke-width="3" stroke-linecap="round"/></svg>
    <div class="login-title">My Active Youth</div>
    <div class="login-sub">Aliado Community Health</div>
    <div class="login-label">Passcode</div>
    <input id="pass" class="login-input" type="password" inputmode="numeric" autocomplete="off" placeholder="&#8226;&#8226;&#8226;&#8226;">
    <button id="verify" class="login-btn">Verify &rarr;</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>
<div id="app" style="display:none">
  <div class="header">
    <div class="header-center">
      <div class="header-brand">
        <svg viewBox="0 0 40 40" fill="none"><circle cx="14" cy="14" r="7" fill="#1a3a8f"/><circle cx="26" cy="14" r="7" fill="#3b5fc0"/><path d="M4 36c0-5.523 4.477-10 10-10h12c5.523 0 10 4.477 10 10" stroke="#1a3a8f" stroke-width="3" stroke-linecap="round"/></svg>
        My Active Youth
      </div>
      <div class="header-greeting" id="greeting"></div>
      <div class="header-quote" id="quote"></div>
    </div>
  </div>
  <div class="kpi-strip">
    <div class="kpi-card blue"><div class="kpi-top"><div class="kpi-icon blue">&#128101;</div><div class="kpi-text"><div class="kpi-label">Active Youth</div><div class="kpi-value" id="k1">0</div><div class="kpi-sub">In your caseload</div></div></div><div class="kpi-bar-bg"><div class="kpi-bar-fg"></div></div></div>
    <div class="kpi-card green"><div class="kpi-top"><div class="kpi-icon green">&#128188;</div><div class="kpi-text"><div class="kpi-label">IIC Cases</div><div class="kpi-value" id="k2">0</div><div class="kpi-sub">Currently active</div></div></div><div class="kpi-bar-bg"><div class="kpi-bar-fg"></div></div></div>
    <div class="kpi-card purple"><div class="kpi-top"><div class="kpi-icon purple">&#128106;</div><div class="kpi-text"><div class="kpi-label">Parent Coaching</div><div class="kpi-value" id="k3">0</div><div class="kpi-sub">Currently active</div></div></div><div class="kpi-bar-bg"><div class="kpi-bar-fg"></div></div></div>
    <div class="kpi-card orange"><div class="kpi-top"><div class="kpi-icon orange">&#9200;</div><div class="kpi-text"><div class="kpi-label">Expiring Soon</div><div class="kpi-value orange" id="k4">0</div><div class="kpi-sub">Next 14 days</div></div></div><div class="kpi-bar-bg"><div class="kpi-bar-fg"></div></div></div>
  </div>
  <div class="cards-list" id="cards"></div>
</div>
<script>
(function () {
  var BASE = "https://default5c737bedc35d48c39a6d89e766c7c7.03.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/10/workflows/f67696d78b464714b9fe7dd30f9766e3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0";
  var p = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  var clinician = (p.get("c") || "").trim();
  var key = p.get("k") || "";
  var msg = document.getElementById("loginMsg");
  var btn = document.getElementById("verify");
  var pass = document.getElementById("pass");
  if (!clinician || !key) { msg.textContent = "This link is incomplete. Please contact Aliado support."; msg.style.color = "#ef4444"; btn.disabled = true; }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function v(o, k) { return o && o[k] != null ? o[k] : ""; }

  function verify() {
    var code = pass.value.trim();
    if (!code) { msg.textContent = "Please enter your passcode."; msg.style.color = "#ef4444"; return; }
    btn.disabled = true; msg.textContent = "Verifying..."; msg.style.color = "#7a86a0";
    fetch(BASE + "&sig=" + encodeURIComponent(key), {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      referrerPolicy: "no-referrer",
      body: JSON.stringify({ clinician: clinician, passcode: code })
    })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) { btn.disabled = false; msg.textContent = "Incorrect passcode. Please try again."; msg.style.color = "#ef4444"; pass.value = ""; pass.focus(); return; }
      render(d);
    })
    .catch(function () { btn.disabled = false; msg.textContent = "We couldn't connect right now. Please try again."; msg.style.color = "#ef4444"; });
  }
  btn.addEventListener("click", verify);
  pass.addEventListener("keydown", function (e) { if (e.key === "Enter") verify(); });

  function render(d) {
    var quotes = ["Every visit is an opportunity to change a life.", "Small moments create lasting change.", "Compassion makes every encounter meaningful.", "Every family deserves to feel supported.", "Your work changes lives one visit at a time.", "Hope grows through every connection.", "Consistency creates trust.", "Today's visit can change tomorrow."];
    var hour = new Date().getHours();
    var greet = hour < 12 ? "Good Morning" : hour < 18 ? "Good Afternoon" : "Good Evening";
    var emoji = hour < 12 ? "\u2600\uFE0F" : hour < 18 ? "\uD83D\uDC4B" : "\uD83C\uDF19";
    document.getElementById("greeting").textContent = greet + ", " + clinician.split(/\s+/)[0] + " " + emoji;
    document.getElementById("quote").textContent = quotes[Math.floor(Math.random() * quotes.length)];
    var k = d.kpi || {};
    var cases = d.cases || [];
    document.getElementById("k1").textContent = v(k, "Active Youth") || cases.length;
    document.getElementById("k2").textContent = v(k, "IIC Cases") || 0;
    document.getElementById("k3").textContent = v(k, "Parent Coaching") || 0;
    document.getElementById("k4").textContent = v(k, "Expiring Soon") || 0;
    var out = "";
    cases.forEach(function (c, i) {
      out += '<div class="youth-card" data-i="' + i + '">' +
        '<div class="card-main">' +
          '<div class="card-left">' +
            '<span class="status-badge">Active</span>' +
            '<h2 class="youth-name">' + esc(c.name) + '</h2>' +
            '<div class="youth-parent">&#128106; ' + esc(c.parent) + '</div>' +
            '<div class="youth-meta">&#127760; ' + esc(c.lang) + ' &nbsp;&bull;&nbsp; &#128101; ' + esc(c.service) + '</div>' +
            '<div class="youth-address">&#128205; ' + esc(c.address) + '</div>' +
            '<div class="youth-caseid">&#129706; Case ID: <strong>' + esc(c.caseId) + '</strong></div>' +
          '</div>' +
          '<div class="card-middle-row">' +
            '<div class="card-auth">' +
              '<div class="section-label">Authorization</div>' +
              '<div class="auth-top">' +
                '<div class="auth-circle-wrap"><svg class="auth-ring" viewBox="0 0 80 80"><circle class="ring-bg" cx="40" cy="40" r="34"/><circle class="ring-fg" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="213.6"/></svg>' +
                '<div class="auth-days-inner"><span class="days-num">' + esc(c.days) + '</span><span class="days-label">DAYS<br>LEFT</span></div></div>' +
                '<div class="auth-details">' +
                  '<div class="auth-row"><span class="auth-row-label">Start Date</span><span class="auth-row-value auth-start" data-serial="' + esc(c.authStart) + '">' + esc(c.authStartDisp) + '</span></div>' +
                  '<div class="auth-row"><span class="auth-row-label">End Date</span><span class="auth-row-value auth-end" data-serial="' + esc(c.authEnd) + '">' + esc(c.authEndDisp) + '</span></div>' +
                  '<div class="auth-row"><span class="auth-row-label">Total Units</span><span class="auth-row-value">' + esc(c.units) + '</span></div>' +
                  '<div class="auth-row"><span class="auth-row-label">Status</span><span class="auth-row-value green">' + esc(c.authStatus) + '</span></div>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="card-cm">' +
              '<div class="section-label">Care Manager</div>' +
              '<div class="cm-row"><div class="cm-avatar">CM</div><div><div class="cm-name">' + esc(c.cmName) + '</div><div class="cm-agency">' + esc(c.cmAgency) + '</div></div></div>' +
              '<div class="cm-contact"><span>&#128222;</span><a href="' + esc(c.callCM) + '">' + esc(c.cmPhone) + '</a></div>' +
              '<div class="cm-contact"><span>&#9993;&#65039;</span><a href="mailto:' + esc(c.cmEmail) + '">' + esc(c.cmEmail) + '</a></div>' +
            '</div>' +
          '</div>' +
          '<div class="card-actions">' +
            '<a href="' + esc(c.encounter) + '" target="_blank" rel="noopener" class="btn btn-primary">&#9654; Start Encounter</a>' +
            '<button class="btn btn-schedule" data-act="sched">&#128197; Schedule Appointment</button>' +
            '<a href="' + esc(c.maps) + '" target="_blank" rel="noopener" class="btn btn-nav">&#128205; Navigate</a>' +
            '<a href="' + esc(c.callFamily) + '" class="btn btn-family">&#128101; Call Family</a>' +
            '<a href="' + esc(c.callCM) + '" class="btn btn-cm">&#128100; Care Manager</a>' +
          '</div>' +
        '</div>' +
        '<div class="schedule-form"><div class="schedule-form-inner">' +
          '<div class="schedule-title">&#128197; Schedule Appointment</div>' +
          '<div class="schedule-youth">' + esc(c.name) + ' &mdash; ' + esc(c.parent) + '</div>' +
          '<div class="schedule-fields">' +
            '<div class="schedule-field"><label>Date</label><input type="date" class="schedule-date"></div>' +
            '<div class="schedule-field"><label>Time</label><input type="time" class="schedule-time"></div>' +
            '<div class="schedule-field"><label>Duration</label><select class="schedule-duration"><option value="60">1 hour</option><option value="90">1.5 hours</option><option value="120" selected>2 hours</option><option value="150">2.5 hours</option><option value="180">3 hours</option></select></div>' +
          '</div>' +
          '<button class="btn btn-confirm" data-act="confirm">&#9989; Confirm Appointment</button>' +
          '<div class="cal-links">' +
            '<a class="btn btn-cal cal-google" target="_blank" rel="noopener">&#128197; Add to Google Calendar</a>' +
            '<a class="btn btn-cal cal-ics">&#128241; Add to iPhone / Outlook Calendar</a>' +
          '</div>' +
          '<button class="btn btn-cancel-schedule" data-act="sched">Cancel</button>' +
          '<div class="schedule-status"></div>' +
        '</div></div>' +
        '<div class="card-referral-bar">' +
          '<button class="referral-toggle" data-act="ref"><span class="ref-arrow">&#9654;</span> View Full Referral Information</button>' +
          '<div class="referral-body"><div class="ref-title">Administrative Notes</div><div class="ref-content">' + esc(c.notes) + '</div></div>' +
        '</div>' +
      '</div>';
    });
    if (!cases.length) out = '<div class="empty">You have no active youth assigned right now.</div>';
    var list = document.getElementById("cards");
    list.innerHTML = out;
    window.__cases = cases;
    list.querySelectorAll(".youth-card").forEach(function (card) {
      var startEl = card.querySelector(".auth-start"), endEl = card.querySelector(".auth-end"), ring = card.querySelector(".ring-fg"), daysNum = card.querySelector(".days-num");
      var s = parseFloat(startEl.dataset.serial), e = parseFloat(endEl.dataset.serial);
      if (isNaN(s) || isNaN(e) || e <= s) return;
      var start = new Date((s - 25569) * 86400000), end = new Date((e - 25569) * 86400000), today = new Date();
      var total = (end - start) / 86400000, elapsed = (today - start) / 86400000;
      var pct = Math.min(Math.max((total - elapsed) / total, 0), 1);
      ring.setAttribute("stroke-dashoffset", (213.6 * (1 - pct)).toFixed(1));
      var col = pct > 0.5 ? "#16a34a" : pct > 0.25 ? "#f59e0b" : "#ef4444";
      ring.setAttribute("stroke", col); daysNum.style.color = col;
    });
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function stamp(dt) { return dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()) + "T" + pad(dt.getHours()) + pad(dt.getMinutes()) + "00"; }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]");
    if (!b) return;
    var card = b.closest(".youth-card");
    var act = b.getAttribute("data-act");
    if (act === "ref") {
      var body = card.querySelector(".referral-body"), arrow = b.querySelector(".ref-arrow");
      var open = body.style.display === "block";
      body.style.display = open ? "none" : "block";
      arrow.style.transform = open ? "" : "rotate(90deg)";
    } else if (act === "sched") {
      var f = card.querySelector(".schedule-form");
      f.style.display = f.style.display === "block" ? "none" : "block";
    } else if (act === "confirm") {
      var c = window.__cases[parseInt(card.getAttribute("data-i"), 10)];
      var date = card.querySelector(".schedule-date").value, time = card.querySelector(".schedule-time").value;
      var dur = parseInt(card.querySelector(".schedule-duration").value, 10);
      var status = card.querySelector(".schedule-status");
      if (!date || !time) { status.textContent = "\u26A0\uFE0F Please select date and time."; status.style.color = "#ef4444"; return; }
      var start = new Date(date + "T" + time + ":00"), end = new Date(start.getTime() + dur * 60000);
      var title = "Appointment with " + c.name;
      var details = "Parent/Guardian: " + c.parent + (c.phone ? "\nPhone: " + c.phone : "");
      var g = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) + "&dates=" + stamp(start) + "/" + stamp(end) + "&details=" + encodeURIComponent(details) + "&location=" + encodeURIComponent(c.address || "");
      var ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Aliado Community Health//My Active Youth//EN", "BEGIN:VEVENT", "UID:" + Date.now() + "@aliado", "DTSTAMP:" + stamp(new Date()), "DTSTART:" + stamp(start), "DTEND:" + stamp(end), "SUMMARY:" + title, "LOCATION:" + String(c.address || "").replace(/[,;]/g, " "), "DESCRIPTION:" + details.replace(/\n/g, "\\n"), "END:VEVENT", "END:VCALENDAR"].join("\r\n");
      card.querySelector(".cal-google").href = g;
      var icsLink = card.querySelector(".cal-ics");
      icsLink.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
      icsLink.setAttribute("download", "appointment.ics");
      card.querySelector(".cal-links").style.display = "block";
      status.textContent = "\u2705 Ready! Tap one of the buttons above to save it to your calendar.";
      status.style.color = "#16a34a";
    }
  });
})();
</script>
</body>
</html>
