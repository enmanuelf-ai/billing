<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Therapeutic tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --ink:#16224A; --muted:#5E6886; --line:#DDE3F1; --soft:#E7ECF8; --navy:#1A3A8F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0F1530;--surface:#1A2246;--ink:#EEF2FF;--muted:#A8B3D6;--line:#2C3766;--soft:#232D58;--navy:#8FA9FF;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0F1530;--surface:#1A2246;--ink:#EEF2FF;--muted:#A8B3D6;--line:#2C3766;--soft:#232D58;--navy:#8FA9FF;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Lato,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 18px "Baloo 2",system-ui,sans-serif;color:var(--navy);display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--navy);display:inline-block}
.alogo{display:block;height:44px;width:auto;border-radius:10px;background:#fff;padding:2px 6px}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font:700 14px Lato,sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(22,34,74,.15)}
button:focus-visible,a:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
h1{font:800 clamp(34px,9vw,48px)/1 "Baloo 2",system-ui,sans-serif;margin:22px 0 6px}
.q{font:700 21px/1.2 "Baloo 2",system-ui,sans-serif;margin:0 0 14px;color:var(--muted)}
.rolebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:0 0 14px}
.rolebar b{color:var(--ink)}
.rolebar button{border:0;background:none;color:var(--navy);font:700 14px Lato,sans-serif;cursor:pointer;padding:0;text-decoration:underline}

.needs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.need{position:relative;text-align:left;border:0;border-radius:24px;padding:16px 14px 14px;cursor:pointer;color:#16224A;
  background:var(--c);min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.need .e{font-size:34px;line-height:1}
.need b{font:800 19px/1.1 "Baloo 2",system-ui,sans-serif;display:block}
.need small{font-size:13px;font-weight:700;opacity:.75}
.need:active{transform:scale(.98)}
.need.off{background:var(--surface);border:2px dashed var(--line);color:var(--muted);cursor:default}
.need.off .e{filter:grayscale(1);opacity:.6}

.back{border:0;background:none;color:var(--navy);font:700 15px Lato,sans-serif;cursor:pointer;padding:8px 0;display:flex;align-items:center;gap:6px;margin-top:10px}
.need-head{display:flex;align-items:center;gap:14px;margin:8px 0 6px}
.need-head .ico{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;background:var(--c)}
.need-head h2{font:800 28px/1.05 "Baloo 2",system-ui,sans-serif;margin:0}
.need-head p{margin:2px 0 0;color:var(--muted);font-size:15px}
.tools{display:grid;gap:10px;margin-top:16px}
.tool{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.tool:active{transform:scale(.985)}
.tool .e{font-size:32px;line-height:1;flex:none;width:40px;text-align:center}
.tool h3{margin:0;font:700 20px/1.15 "Baloo 2",system-ui,sans-serif}
.tool p{margin:2px 0 6px;color:var(--muted);font-size:15px}
.age{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.go{margin-left:auto;font-size:22px;color:var(--muted);flex:none}
.empty{color:var(--muted);margin:14px 0 0}

.soon{margin-top:30px;border-top:2px solid var(--line);padding-top:18px}
.soon h2{font:800 20px "Baloo 2",system-ui,sans-serif;margin:0 0 4px}
.soon > p{margin:0 0 12px;color:var(--muted);font-size:14px}
.soon ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.soon li{font-size:14.5px;display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.soon li span{flex:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="alogo" src="https://www.jotform.com/uploads/enmanuelf59/form_files/Captura%20de%20pantalla%202026-04-22%20160244.69fbcf54529891.59675446.jpg" alt="Aliado Community Health">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>

  <!-- Home -->
  <section id="home">
    <h1 data-t="title"></h1>
    <p class="q" data-t="q"></p>
    <p class="rolebar" id="rolebar" hidden></p>
    <div class="needs" id="needs"></div>
    <div class="soon" id="soon"></div>
  </section>

  <!-- Need view -->
  <section id="view" hidden>
    <button class="back" id="back"></button>
    <div class="need-head" id="vHead"></div>
    <div class="tools" id="vTools"></div>
  </section>
</div>

<script>
const LINKS = {
  emotions: "juego-emociones.html",
  monster:  "monstruo-preocupacion.html",
  special:  "tiempo-especial.html",
  ba:       "kit-conducta-ba.html",
  anger:    "termometro-enojo.html",
  body:     "kit-cuerpo-teens.html",
  home:     "tabla-casa.html"
};

const UI = {
  en:{title:"Therapeutic tools", q:"What do you need right now?", tools:n=>n===1?"1 tool":`${n} tools`, soonTile:"Coming soon",
      back:"← All needs", ages:"Ages", soonT:"Coming soon", soonP:"Tools we're preparing. They'll appear above when ready.",
      showing:"Showing tools for", showAll:"Show all", roles:{iic:"IIC clinicians",ba:"BA",pc:"Parent Coaching"},
      none:"No tools for your role in this area yet."},
  es:{title:"Herramientas terapéuticas", q:"¿Qué necesitas ahora mismo?", tools:n=>n===1?"1 herramienta":`${n} herramientas`, soonTile:"Próximamente",
      back:"← Todas las necesidades", ages:"Edades", soonT:"Próximamente", soonP:"Herramientas que estamos preparando. Aparecerán arriba cuando estén listas.",
      showing:"Mostrando herramientas para", showAll:"Ver todas", roles:{iic:"Clínicos IIC",ba:"BA",pc:"Parent Coaching"},
      none:"Todavía no hay herramientas para tu rol en esta área."}
};

const NEEDS = [
  {id:"calm",    e:"🔥", c:"#FFB4A2", en:["Calm down now","When the child is dysregulated"],          es:["Calmarse ya","Cuando el niño está desregulado"]},
  {id:"feel",    e:"😊", c:"#FFD66B", en:["Work on feelings","Recognize and express emotions"],      es:["Trabajar emociones","Reconocer y expresar lo que siente"]},
  {id:"worry",   e:"😟", c:"#C3B2F7", en:["Worries & anxiety","Make worries smaller"],              es:["Preocupación y ansiedad","Hacer más pequeñas las preocupaciones"]},
  {id:"behave",  e:"⭐", c:"#8ED6B4", en:["Behavior & routines","Reinforce, transitions, tracking"], es:["Conducta y rutinas","Reforzar, transiciones y registro"]},
  {id:"parent",  e:"👨‍👧", c:"#FFC59A", en:["Coach the parent","Skills for caregivers at home"],     es:["Coaching al padre","Habilidades para los padres en casa"]},
  {id:"start",   e:"👋", c:"#9CC8F7", en:["Start & build trust","Check-ins and icebreakers"],        es:["Empezar y crear confianza","Check-in y para romper el hielo"]}
];

/* ready tools */
const TOOLS = [
  {e:"🌡️",link:"anger",  needs:["calm","feel"],   roles:["iic","ba"], age:"5–12",
   en:["Anger thermometer","Rate anger and practice strategies to bring it down."], es:["Termómetro del enojo","Medir el enojo y practicar estrategias para bajarlo."]},
  {e:"🧊",link:"body",   needs:["calm","worry"],  roles:["iic"],      age:"13+",
   en:["Body toolkit","TIPP skills to quickly bring down an intense emotion."],    es:["Kit para el cuerpo","Técnicas TIPP para bajar rápido una emoción intensa."]},
  {e:"🎭",link:"emotions",needs:["feel"],         roles:["iic","ba"], age:"5–12",
   en:["Feelings game","Recognize feelings in faces and situations."],             es:["Juego de emociones","Reconocer emociones en caras y situaciones."]},
  {e:"👾",link:"monster", needs:["worry"],        roles:["iic"],      age:"5–12",
   en:["Worry monster","Draw the worry and shrink it with strategies."],           es:["Monstruo de la preocupación","Dibujar la preocupación y encogerla con estrategias."]},
  {e:"⭐",link:"ba",      needs:["behave","parent"],roles:["ba","pc"],age:"5–12",
   en:["Behavior kit","Tokens, First / Then board and ABC log."],                  es:["Kit de conducta","Fichas, Primero / Después y registro ABC."]},
  {e:"🏠",link:"home",    needs:["parent","behave"],roles:["ba","pc"],age:"3–12",
   en:["Star chart at home","A weekly star chart parents use at home between sessions."], es:["Tabla de estrellas en casa","Tabla semanal que los padres usan en casa entre sesiones."]},
  {e:"👨‍👧",link:"special",needs:["parent"],       roles:["pc"],       age:"2–8",
   en:["Special time","5 minutes of child-led play, with parent coaching."],       es:["Tiempo especial","5 minutos de juego dirigido por el niño, con coaching al padre."]}
];

/* coming soon */
const SOON = [
  {e:"🎈",needs:["calm"],  roles:["iic","ba","pc"], en:"Guided breathing",     es:"Respiración guiada"},
  {e:"🖐️",needs:["calm","worry"],roles:["iic"],      en:"5-4-3-2-1 grounding",  es:"5-4-3-2-1"},
  {e:"🎡",needs:["calm"],  roles:["iic","ba"],      en:"Coping wheel",         es:"Ruleta de estrategias"},
  {e:"🧍",needs:["feel"],  roles:["iic"],           en:"Body map",             es:"Mapa del cuerpo"},
  {e:"🔍",needs:["worry"], roles:["iic"],           en:"Thought detective",    es:"Detective de pensamientos"},
  {e:"🗑️",needs:["worry"], roles:["iic"],           en:"Toss the thought",     es:"Pensamientos a la basura"},
  {e:"🗓️",needs:["behave","parent"],roles:["ba","pc"],en:"Visual routine",      es:"Rutina visual"},
  {e:"⏳",needs:["behave"],roles:["ba","pc"],       en:"Visual timer",         es:"Timer visual"},
  {e:"🚦",needs:["behave"],roles:["iic","ba"],      en:"Decision traffic light",es:"Semáforo de decisiones"},
  {e:"🤔",needs:["behave"],roles:["iic","ba"],      en:"What would you do?",   es:"¿Qué harías tú?"},
  {e:"👋",needs:["start"], roles:["iic","ba"],      en:"How am I today?",      es:"¿Cómo llego hoy?"},
  {e:"🎲",needs:["start"], roles:["iic","ba"],      en:"Get-to-know-me dice",  es:"Dado Conóceme"},
  {e:"🧱",needs:["start"], roles:["iic"],           en:"Question tower",       es:"Torre de preguntas"}
];

let lang = "en", open = null;
let role = ["iic","ba","pc"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "all";
const $ = id => document.getElementById(id);
const forRole = t => role==="all" || t.roles.includes(role);
const toolsFor = n => TOOLS.filter(t => t.needs.includes(n) && forRole(t));

function renderHome(){
  const u = UI[lang];
  const rb = $("rolebar");
  if(role!=="all"){ rb.hidden=false; rb.innerHTML = `${u.showing} <b>${u.roles[role]}</b> · <button id="all">${u.showAll}</button>`;
    $("all").onclick = ()=>{ role="all"; try{history.replaceState(null,"",location.pathname);}catch(e){} paint(); }; }
  else rb.hidden = true;

  $("needs").innerHTML = "";
  NEEDS.forEach(n=>{
    const k = toolsFor(n.id).length, b = document.createElement("button");
    b.className = "need" + (k?"":" off"); b.style.setProperty("--c", n.c); b.disabled = !k;
    b.innerHTML = `<span class="e" aria-hidden="true">${n.e}</span><div><b>${n[lang][0]}</b><small>${k?u.tools(k):u.soonTile}</small></div>`;
    if(k) b.onclick = ()=>{ open=n.id; renderView(); show("view"); };
    $("needs").appendChild(b);
  });

  const soon = SOON.filter(forRole);
  $("soon").hidden = !soon.length;
  $("soon").innerHTML = `<h2>${u.soonT}</h2><p>${u.soonP}</p><ul>${soon.map(s=>`<li><span aria-hidden="true">${s.e}</span>${s[lang]}</li>`).join("")}</ul>`;
}

function renderView(){
  const u = UI[lang], n = NEEDS.find(x=>x.id===open);
  $("back").textContent = u.back;
  $("vHead").innerHTML = `<div class="ico" style="--c:${n.c}" aria-hidden="true">${n.e}</div><div><h2>${n[lang][0]}</h2><p>${n[lang][1]}</p></div>`;
  const list = toolsFor(open);
  $("vTools").innerHTML = list.length ? list.map(t=>`<a class="tool" href="${LINKS[t.link]}">
      <span class="e" aria-hidden="true">${t.e}</span>
      <div><h3>${t[lang][0]}</h3><p>${t[lang][1]}</p><span class="age">${u.ages} ${t.age}</span></div>
      <span class="go" aria-hidden="true">›</span></a>`).join("") : `<p class="empty">${u.none}</p>`;
}

function show(v){ $("home").hidden = v!=="home"; $("view").hidden = v!=="view"; window.scrollTo(0,0); }
$("back").onclick = ()=>{ open=null; show("home"); };

function paint(){
  document.documentElement.lang = lang; document.title = UI[lang].title;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent = UI[lang][el.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  renderHome(); if(open) renderView();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; paint(); });
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); role=["iic","ba","pc"].includes(h)?h:"all"; open=null; show("home"); paint(); });
paint();
</script>
</body>
</html>
