<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Therapeutic tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --ink:#16224A; --muted:#5E6886; --line:#DDE3F1; --soft:#E7ECF8; --navy:#1A3A8F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0F1530;--surface:#1A2246;--ink:#EEF2FF;--muted:#A8B3D6;--line:#2C3766;--soft:#232D58;--navy:#8FA9FF;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0F1530;--surface:#1A2246;--ink:#EEF2FF;--muted:#A8B3D6;--line:#2C3766;--soft:#232D58;--navy:#8FA9FF;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Lato,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 18px "Baloo 2",system-ui,sans-serif;color:var(--navy);display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--navy);display:inline-block}
.alogo{display:block;height:44px;width:auto;border-radius:10px;background:#fff;padding:2px 6px}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font:700 14px Lato,sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(22,34,74,.15)}
button:focus-visible,a:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
h1{font:800 clamp(34px,9vw,48px)/1 "Baloo 2",system-ui,sans-serif;margin:22px 0 6px}
.q{font:700 21px/1.2 "Baloo 2",system-ui,sans-serif;margin:0 0 14px;color:var(--muted)}
.rolebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:0 0 14px}
.rolebar b{color:var(--ink)}
.rolebar button{border:0;background:none;color:var(--navy);font:700 14px Lato,sans-serif;cursor:pointer;padding:0;text-decoration:underline}

.needs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.need{position:relative;text-align:left;border:0;border-radius:24px;padding:16px 14px 14px;cursor:pointer;color:#16224A;
  background:var(--c);min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.need .e{font-size:34px;line-height:1}
.need b{font:800 19px/1.1 "Baloo 2",system-ui,sans-serif;display:block}
.need small{font-size:13px;font-weight:700;opacity:.75}
.need:active{transform:scale(.98)}
.need.off{background:var(--surface);border:2px dashed var(--line);color:var(--muted);cursor:default}
.need.off .e{filter:grayscale(1);opacity:.6}

.back{border:0;background:none;color:var(--navy);font:700 15px Lato,sans-serif;cursor:pointer;padding:8px 0;display:flex;align-items:center;gap:6px;margin-top:10px}
.need-head{display:flex;align-items:center;gap:14px;margin:8px 0 6px}
.need-head .ico{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;background:var(--c)}
.need-head h2{font:800 28px/1.05 "Baloo 2",system-ui,sans-serif;margin:0}
.need-head p{margin:2px 0 0;color:var(--muted);font-size:15px}
.tools{display:grid;gap:10px;margin-top:16px}
.tool{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.tool:active{transform:scale(.985)}
.tool .e{font-size:32px;line-height:1;flex:none;width:40px;text-align:center}
.tool h3{margin:0;font:700 20px/1.15 "Baloo 2",system-ui,sans-serif}
.tool p{margin:2px 0 6px;color:var(--muted);font-size:15px}
.age{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.go{margin-left:auto;font-size:22px;color:var(--muted);flex:none}
.empty{color:var(--muted);margin:14px 0 0}

.soon{margin-top:30px;border-top:2px solid var(--line);padding-top:18px}
.soon h2{font:800 20px "Baloo 2",system-ui,sans-serif;margin:0 0 4px}
.soon > p{margin:0 0 12px;color:var(--muted);font-size:14px}
.soon ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.soon li{font-size:14.5px;display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.soon li span{flex:none}
.need,.tool,.back,.lang button,.chip,.qx{transition:transform .12s,background-color .15s,border-color .15s,box-shadow .15s,filter .15s}
.need:not(.off):hover{filter:brightness(1.05);box-shadow:0 6px 16px rgba(22,34,74,.18);transform:translateY(-2px)}
.tool:hover{border-color:var(--navy);box-shadow:0 4px 14px rgba(22,34,74,.12);transform:translateY(-1px)}
.back:hover{text-decoration:underline}
.lang button:hover{color:var(--navy)}
.qbg{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.45);display:flex;align-items:flex-end;justify-content:center}
.qsheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qhead h2{font:800 24px/1.1 "Baloo 2",system-ui,sans-serif;margin:0}
.qx{border:0;background:var(--soft);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.qx:hover{background:var(--line)}
.qsheet > p{color:var(--muted);margin:8px 0 0}
.qlangs{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:700 14px Lato,sans-serif;cursor:pointer}
.chip:hover{border-color:var(--navy)}
.chip[aria-pressed="true"]{background:#1A3A8F;border-color:#1A3A8F;color:#fff}
.qbox{background:#fff;border-radius:22px;padding:18px;display:flex;justify-content:center;margin:8px auto 0;width:fit-content;border:2px solid var(--line)}
.qbox img,.qbox canvas{width:240px!important;height:240px!important}
.sharebtn{display:block;margin:14px auto 0;border:0;background:#1A3A8F;color:#fff;border-radius:999px;padding:13px 22px;font:700 16px Lato,sans-serif;cursor:pointer;transition:filter .15s,transform .12s}
.sharebtn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.sharenote{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 0;min-height:18px}
.qsteps{margin:12px 0 0;padding-left:20px;display:grid;gap:5px}
.fb{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;width:calc(100% - 28px);max-width:460px;background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(22,34,74,.22);padding:16px 16px 14px;animation:fbin .35s ease-out}
@keyframes fbin{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.fb h4{margin:0 0 4px;font:800 19px/1.2 "Baloo 2",system-ui,sans-serif;color:var(--ink)}
.fb p{margin:0 0 10px;font-size:14.5px;color:var(--muted)}
.fb .q{font-weight:700;color:var(--ink);font-size:16px;margin:0 0 10px}
.fbbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbbtns button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:11px;font:800 16px Lato,sans-serif;cursor:pointer;transition:border-color .15s,background-color .15s,transform .12s}
.fbbtns button:hover{border-color:var(--navy);transform:translateY(-1px)}
.fbbtns button[aria-pressed="true"]{background:#1A3A8F;border-color:#1A3A8F;color:#fff}
.fb textarea{width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 11px;font:400 15px Lato,sans-serif;resize:none;height:62px;box-sizing:border-box}
.fbsend{margin-top:8px;width:100%;border:0;background:#1A3A8F;color:#fff;border-radius:999px;padding:12px;font:800 16px Lato,sans-serif;cursor:pointer;transition:filter .15s}
.fbsend:hover{filter:brightness(1.15)}
.fblater{display:block;margin:8px auto 0;border:0;background:none;color:var(--muted);font:700 14px Lato,sans-serif;cursor:pointer;text-decoration:underline}
.fbthanks{text-align:center;padding:6px 0}
.fbthanks b{display:block;font:800 22px "Baloo 2",system-ui,sans-serif;color:var(--ink)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="alogo" src="https://www.jotform.com/uploads/enmanuelf59/form_files/Captura%20de%20pantalla%202026-04-22%20160244.69fbcf54529891.59675446.jpg" alt="Aliado Community Health">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>

  <!-- Home -->
  <section id="home">
    <h1 data-t="title"></h1>
    <p class="q" data-t="q"></p>
    <p class="rolebar" id="rolebar" hidden></p>
    <div class="needs" id="needs"></div>
    <div class="soon" id="soon"></div>
  </section>

  <!-- Need view -->
  <section id="view" hidden>
    <button class="back" id="back"></button>
    <div class="need-head" id="vHead"></div>
    <div class="tools" id="vTools"></div>
  </section>
</div>

<div class="qbg" id="qBg" hidden><div class="qsheet" role="dialog" aria-modal="true" aria-labelledby="qT">
  <div class="qhead"><h2 id="qT"></h2><button class="qx" id="qX" aria-label="Close">✕</button></div>
  <p id="qP"></p><div class="qlangs" id="qLangs"></div><div class="qbox" id="qBox"></div><button class="sharebtn" id="qShare"></button><p class="sharenote" id="qNote"></p><ol class="qsteps" id="qSteps"></ol>
</div></div>
<div class="fb" id="fb" hidden role="dialog" aria-labelledby="fbT">
  <div id="fbAsk"><h4 id="fbT"></h4><p id="fbP"></p><div class="q" id="fbQ"></div>
    <div class="fbbtns"><button id="fbYes"></button><button id="fbNo"></button></div>
    <div id="fbMore" hidden><textarea id="fbTxt" maxlength="500"></textarea><button class="fbsend" id="fbSend"></button></div>
    <button class="fblater" id="fbLater"></button></div>
  <div class="fbthanks" id="fbThanks" hidden><b id="fbTy"></b><span id="fbTy2"></span></div>
</div>
<script>
const LINKS = {
  emotions: "juego-emociones.html",
  monster:  "monstruo-preocupacion.html",
  special:  "tiempo-especial.html",
  ba:       "kit-conducta-ba.html",
  anger:    "termometro-enojo.html",
  body:     "kit-cuerpo-teens.html",
  home:     "tabla-casa.html"
};

const UI = {
  en:{title:"Therapeutic tools", q:"What do you need right now?", tools:n=>n===1?"1 tool":`${n} tools`, soonTile:"Coming soon",
      back:"← All needs", ages:"Ages", soonT:"Coming soon", soonP:"Tools we're preparing. They'll appear above when ready.",
      showing:"Showing tools for", showAll:"Show all", roles:{iic:"IIC clinicians",ba:"BA",pc:"Parent Coaching"},
      none:"No tools for your role in this area yet.",fbT:"Quick question 🙂",fbP:"We're building these tools for you and want to know if we should keep developing them.",fbQ:"Do you find Therapeutic Tools helpful?",fbYes:"👍 Yes",fbNo:"👎 No",fbPh:"Anything you'd like us to add or change? (optional)",fbSend:"Send",fbLater:"Not now",fbTy:"Thank you!",fbTy2:"Your answer helps us decide what to build next.",qT:"Star chart for home",share:"📤 Send the link to the parent",copied:"Link copied. Paste it in a text or WhatsApp to the parent.",qP:"The parent scans this code with their phone camera and the star chart opens, ready to use at home during the week.",qSteps:["Ask the parent to open their phone camera and point it at the code.","Have them tap the link that appears on the screen.","Set up the chart together with the child before the session ends."]},
  es:{title:"Herramientas terapéuticas", q:"¿Qué necesitas ahora mismo?", tools:n=>n===1?"1 herramienta":`${n} herramientas`, soonTile:"Próximamente",
      back:"← Todas las necesidades", ages:"Edades", soonT:"Próximamente", soonP:"Herramientas que estamos preparando. Aparecerán arriba cuando estén listas.",
      showing:"Mostrando herramientas para", showAll:"Ver todas", roles:{iic:"Clínicos IIC",ba:"BA",pc:"Parent Coaching"},
      none:"Todavía no hay herramientas para tu rol en esta área.",fbT:"Una pregunta rápida 🙂",fbP:"Estamos creando estas herramientas para ustedes y queremos saber si debemos seguir desarrollándolas.",fbQ:"¿Te parecen útiles las Therapeutic Tools?",fbYes:"👍 Sí",fbNo:"👎 No",fbPh:"¿Algo que te gustaría que agreguemos o cambiemos? (opcional)",fbSend:"Enviar",fbLater:"Ahora no",fbTy:"¡Gracias!",fbTy2:"Tu respuesta nos ayuda a decidir qué construir.",qT:"Tabla de estrellas para casa",share:"📤 Enviar el enlace al padre",copied:"Enlace copiado. Péguelo en un mensaje de texto o WhatsApp al padre.",qP:"El padre escanea este código con la cámara de su celular y se le abre la tabla de estrellas para usar en casa durante la semana.",qSteps:["Pídale al padre que abra la cámara de su celular y apunte al código.","Que toque el enlace que aparece en la pantalla.","Configuren la tabla juntos con el niño antes de terminar la sesión."]}
};

const NEEDS = [
  {id:"calm",    e:"🔥", c:"#FFB4A2", en:["Calm down now","When the child is dysregulated"],          es:["Calmarse ya","Cuando el niño está desregulado"]},
  {id:"feel",    e:"😊", c:"#FFD66B", en:["Work on feelings","Recognize and express emotions"],      es:["Trabajar emociones","Reconocer y expresar lo que siente"]},
  {id:"worry",   e:"😟", c:"#C3B2F7", en:["Worries & anxiety","Make worries smaller"],              es:["Preocupación y ansiedad","Hacer más pequeñas las preocupaciones"]},
  {id:"behave",  e:"⭐", c:"#8ED6B4", en:["Behavior & routines","Reinforce, transitions, tracking"], es:["Conducta y rutinas","Reforzar, transiciones y registro"]},
  {id:"parent",  e:"👨‍👧", c:"#FFC59A", en:["Coach the parent","Skills for caregivers at home"],     es:["Coaching al padre","Habilidades para los padres en casa"]},
  {id:"start",   e:"👋", c:"#9CC8F7", en:["Start & build trust","Check-ins and icebreakers"],        es:["Empezar y crear confianza","Check-in y para romper el hielo"]}
];

/* ready tools */
const TOOLS = [
  {e:"🌡️",link:"anger",  needs:["calm","feel"],   roles:["iic","ba"], age:"5–12",
   en:["Anger thermometer","Rate anger and practice strategies to bring it down."], es:["Termómetro del enojo","Medir el enojo y practicar estrategias para bajarlo."]},
  {e:"🧊",link:"body",   needs:["calm","worry"],  roles:["iic"],      age:"13+",
   en:["Body toolkit","TIPP skills to quickly bring down an intense emotion."],    es:["Kit para el cuerpo","Técnicas TIPP para bajar rápido una emoción intensa."]},
  {e:"🎭",link:"emotions",needs:["feel"],         roles:["iic","ba"], age:"5–12",
   en:["Feelings game","Recognize feelings in faces and situations."],             es:["Juego de emociones","Reconocer emociones en caras y situaciones."]},
  {e:"👾",link:"monster", needs:["worry"],        roles:["iic"],      age:"5–12",
   en:["Worry monster","Draw the worry and shrink it with strategies."],           es:["Monstruo de la preocupación","Dibujar la preocupación y encogerla con estrategias."]},
  {e:"⭐",link:"ba",      needs:["behave","parent"],roles:["ba","pc"],age:"5–12",
   en:["Behavior kit","Tokens, First / Then board and ABC log."],                  es:["Kit de conducta","Fichas, Primero / Después y registro ABC."]},
  {e:"🏠",link:"home",    needs:["parent","behave"],roles:["ba","pc"],age:"3–12",
   en:["Star chart at home","Open the weekly chart, show it to the family and share it with them."], es:["Tabla de estrellas en casa","Abra la tabla semanal, muéstresela a la familia y compártala con ellos."]},
  {e:"👨‍👧",link:"special",needs:["parent"],       roles:["pc"],       age:"2–8",
   en:["Special time","5 minutes of child-led play, with parent coaching."],       es:["Tiempo especial","5 minutos de juego dirigido por el niño, con coaching al padre."]}
];

/* coming soon */
const SOON = [
  {e:"🎈",needs:["calm"],  roles:["iic","ba","pc"], en:"Guided breathing",     es:"Respiración guiada"},
  {e:"🖐️",needs:["calm","worry"],roles:["iic"],      en:"5-4-3-2-1 grounding",  es:"5-4-3-2-1"},
  {e:"🎡",needs:["calm"],  roles:["iic","ba"],      en:"Coping wheel",         es:"Ruleta de estrategias"},
  {e:"🧍",needs:["feel"],  roles:["iic"],           en:"Body map",             es:"Mapa del cuerpo"},
  {e:"🔍",needs:["worry"], roles:["iic"],           en:"Thought detective",    es:"Detective de pensamientos"},
  {e:"🗑️",needs:["worry"], roles:["iic"],           en:"Toss the thought",     es:"Pensamientos a la basura"},
  {e:"🗓️",needs:["behave","parent"],roles:["ba","pc"],en:"Visual routine",      es:"Rutina visual"},
  {e:"⏳",needs:["behave"],roles:["ba","pc"],       en:"Visual timer",         es:"Timer visual"},
  {e:"🚦",needs:["behave"],roles:["iic","ba"],      en:"Decision traffic light",es:"Semáforo de decisiones"},
  {e:"🤔",needs:["behave"],roles:["iic","ba"],      en:"What would you do?",   es:"¿Qué harías tú?"},
  {e:"👋",needs:["start"], roles:["iic","ba"],      en:"How am I today?",      es:"¿Cómo llego hoy?"},
  {e:"🎲",needs:["start"], roles:["iic","ba"],      en:"Get-to-know-me dice",  es:"Dado Conóceme"},
  {e:"🧱",needs:["start"], roles:["iic"],           en:"Question tower",       es:"Torre de preguntas"}
];

let lang = "en", open = null;
let role = ["iic","ba","pc"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "all";
const $ = id => document.getElementById(id);
const forRole = t => role==="all" || t.roles.includes(role);
const toolsFor = n => TOOLS.filter(t => t.needs.includes(n) && forRole(t));

function renderHome(){
  const u = UI[lang];
  const rb = $("rolebar");
  if(role!=="all"){ rb.hidden=false; rb.innerHTML = `${u.showing} <b>${u.roles[role]}</b> · <button id="all">${u.showAll}</button>`;
    $("all").onclick = ()=>{ role="all"; try{history.replaceState(null,"",location.pathname);}catch(e){} paint(); }; }
  else rb.hidden = true;

  $("needs").innerHTML = "";
  NEEDS.forEach(n=>{
    const k = toolsFor(n.id).length, b = document.createElement("button");
    b.className = "need" + (k?"":" off"); b.style.setProperty("--c", n.c); b.disabled = !k;
    b.innerHTML = `<span class="e" aria-hidden="true">${n.e}</span><div><b>${n[lang][0]}</b><small>${k?u.tools(k):u.soonTile}</small></div>`;
    if(k) b.onclick = ()=>{ open=n.id; renderView(); show("view"); };
    $("needs").appendChild(b);
  });

  const soon = SOON.filter(forRole);
  $("soon").hidden = !soon.length;
  $("soon").innerHTML = `<h2>${u.soonT}</h2><p>${u.soonP}</p><ul>${soon.map(s=>`<li><span aria-hidden="true">${s.e}</span>${s[lang]}</li>`).join("")}</ul>`;
}

function renderView(){
  const u = UI[lang], n = NEEDS.find(x=>x.id===open);
  $("back").textContent = u.back;
  $("vHead").innerHTML = `<div class="ico" style="--c:${n.c}" aria-hidden="true">${n.e}</div><div><h2>${n[lang][0]}</h2><p>${n[lang][1]}</p></div>`;
  const list = toolsFor(open);
  $("vTools").innerHTML = list.length ? list.map(t=>`<a class="tool" href="${LINKS[t.link]+"?v="+VER+(["home","anger","body","special"].includes(t.link)?"&t=1":"")+(window.ttClin&&ttClin()?"&c="+encodeURIComponent(ttClin()):"")}">
      <span class="e" aria-hidden="true">${t.e}</span>
      <div><h3>${t[lang][0]}</h3><p>${t[lang][1]}</p><span class="age">${u.ages} ${t.age}</span></div>
      <span class="go" aria-hidden="true">›</span></a>`).join("") : `<p class="empty">${u.none}</p>`;
  $("vTools").querySelectorAll("[data-qr]").forEach(a=>a.onclick=e=>{e.preventDefault();openQR();});
}
const VER="6";
let qLang="en";
function renderQR(){const u=UI[lang];$("qT").textContent=u.qT;$("qShare").textContent=u.share;$("qNote").textContent="";$("qP").textContent=u.qP;$("qSteps").innerHTML=u.qSteps.map(x=>`<li>${x}</li>`).join("");
 $("qLangs").innerHTML="";[["en","English"],["es","Español"]].forEach(([k,l])=>{const b=document.createElement("button");b.className="chip";b.textContent=l;b.setAttribute("aria-pressed",qLang===k);b.onclick=()=>{qLang=k;renderQR();};$("qLangs").appendChild(b);});
 $("qBox").innerHTML="";try{new QRCode($("qBox"),{text:"https://enmanuelf-ai.github.io/billing/herramientas-terapeuticas/tabla-casa.html?lang="+qLang,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});$("qBox").removeAttribute("title");}catch(e){$("qBox").textContent="QR not available";}}
$("qShare").onclick=async()=>{const url="https://enmanuelf-ai.github.io/billing/herramientas-terapeuticas/tabla-casa.html?lang="+qLang;const text=(qLang==="es"?"¡Hola! Aquí tiene su tabla de estrellas para usar en casa con su hijo esta semana. Su terapeuta la revisará con usted en la próxima sesión: ":"Hi! Here is your star chart to use at home with your child this week. Your therapist will review it with you at the next session: ")+url;
 try{if(navigator.share){await navigator.share({text});return;}}catch(e){if(e&&e.name==="AbortError")return;}
 try{await navigator.clipboard.writeText(text);}catch(e){const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();}
 $("qNote").textContent=UI[lang].copied;};
function openQR(){qLang=lang;renderQR();$("qBg").hidden=false;$("qX").focus();}
$("qX").onclick=()=>{$("qBg").hidden=true;};
$("qBg").onclick=e=>{if(e.target.id==="qBg")$("qBg").hidden=true;};

function show(v){ $("home").hidden = v!=="home"; $("view").hidden = v!=="view"; window.scrollTo(0,0); }
$("back").onclick = ()=>{ open=null; show("home"); };

function paint(){
  document.documentElement.lang = lang; document.title = UI[lang].title;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent = UI[lang][el.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  renderHome(); if(open) renderView(); if(!$("qBg").hidden) renderQR(); if(!$("fb").hidden) fbPaint();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; paint(); });
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); role=["iic","ba","pc"].includes(h)?h:"all"; open=null; show("home"); paint(); });
/* ---- feedback prompt ---- */
const FB_FORM=""; /* Jotform form id */
const FB_KEY="aliado-tt-feedback", FB_DELAY=60000;
const clinician=new URLSearchParams(location.search).get("c")||"";
let fbAns=null;
function fbPaint(){const u=UI[lang];["fbT","fbP","fbQ","fbYes","fbNo","fbSend","fbLater","fbTy","fbTy2"].forEach(k=>$(k).textContent=u[k]);$("fbTxt").placeholder=u.fbPh;}
function fbShow(){fbPaint();$("fb").hidden=false;try{localStorage.setItem(FB_KEY+"-n",(+localStorage.getItem(FB_KEY+"-n")||0)+1)}catch(e){}}
function fbDone(){try{localStorage.setItem(FB_KEY,"done")}catch(e){}}
function fbCheck(){let done=null,shown=0;try{done=localStorage.getItem(FB_KEY);shown=+localStorage.getItem(FB_KEY+"-n")||0}catch(e){}if(done==="done"||shown>=2||sessionStorage.getItem("fbLater"))return;
 let t0=+sessionStorage.getItem("fbStart")||0;if(!t0){t0=Date.now();sessionStorage.setItem("fbStart",t0);}
 if(Date.now()-t0>=FB_DELAY){if($("fb").hidden)fbShow();return;}setTimeout(fbCheck,Math.min(15000,FB_DELAY-(Date.now()-t0)+50));}
function fbPick(v){fbAns=v;$("fbYes").setAttribute("aria-pressed",v==="Yes");$("fbNo").setAttribute("aria-pressed",v==="No");$("fbMore").hidden=false;}
$("fbYes").onclick=()=>fbPick("Yes");$("fbNo").onclick=()=>fbPick("No");
$("fbLater").onclick=()=>{sessionStorage.setItem("fbLater","1");$("fb").hidden=true;};
$("fbSend").onclick=()=>{if(!fbAns)return;
 if(window.ttLog)ttLog("feedback",{answer:fbAns,comment:$("fbTxt").value.trim()});
 fbDone();$("fbAsk").hidden=true;$("fbThanks").hidden=false;setTimeout(()=>{$("fb").hidden=true;},3500);};
const FB_FIELDS={helpful:"",comment:"",clinician:"",lang:""};
paint();
fbCheck();
</script>
<script>
/* TT_LOG: anonymous usage log (no client data) */
(function(){
let FLOWP=null;const getFlow=()=>{if(window.TT_FLOW)return Promise.resolve(window.TT_FLOW);if(FLOWP)return FLOWP;
 let c=null;try{c=sessionStorage.getItem("tt-flow")}catch(e){}if(c)return FLOWP=Promise.resolve(c);
 return FLOWP=fetch("tt-flow.txt",{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{t=(t||"").trim();try{if(t)sessionStorage.setItem("tt-flow",t)}catch(e){}return t;}).catch(()=>"");};
const P=new URLSearchParams(location.search);
let C=P.get("c")||"";try{if(C)sessionStorage.setItem("tt-c",C);else C=sessionStorage.getItem("tt-c")||"";}catch(e){}
const MODE=P.get("t")==="1"?"therapist":(P.has("lang")&&!P.has("c")?"family":(P.has("lang")?"family":"therapist"));
window.ttClin=()=>C;
window.ttLog=function(event,extra){
 const body=Object.assign({event,tool:'Hub',clinician:C,mode:MODE,lang:document.documentElement.lang||"en",answer:"",comment:""},extra||{});
 getFlow().then(FLOW=>{if(!FLOW||FLOW.indexOf("https://")!==0)return;try{fetch(FLOW,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),keepalive:true}).catch(()=>{});}catch(e){}});};
ttLog("open");
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button");if(!b)return;
 if(["tShare","shOpen"].includes(b.id))ttLog("share_open");
 if(["qShare","shSend"].includes(b.id))ttLog("share_link");},true);
})();
</script>
