<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kit de conducta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF6F3;--surface:#FFFFFF;--ink:#13302A;--muted:#55716A;--line:#D3E6DF;--soft:#DDEEE8;--accent:#1F8A6B;--sun:#FFC93C;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1D1A;--surface:#182B27;--ink:#E7F5F0;--muted:#A3C2B9;--line:#2A433D;--soft:#203632;--accent:#4FC9A2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1D1A;--surface:#182B27;--ink:#E7F5F0;--muted:#A3C2B9;--line:#2A433D;--soft:#203632;--accent:#4FC9A2;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Lato,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto;padding:14px 18px 32px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font:700 18px "Baloo 2",sans-serif;color:var(--accent);display:flex;gap:8px;align-items:center}
.brand i{width:10px;height:10px;border-radius:50%;background:#1A3A8F}
.alogo{display:block;height:44px;width:auto;border-radius:10px;background:#fff;padding:2px 6px}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--muted);font:700 14px Lato,sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font:800 clamp(32px,9vw,44px)/1 "Baloo 2",sans-serif;margin:4px 0 0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 0}
.tabs button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px 4px;font:700 13.5px Lato,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:22px}
.tabs button[aria-selected="true"]{background:#1F8A6B;border-color:#1F8A6B;color:#fff}
.label{font-weight:700;margin:4px 0 6px;font-size:15px}
.field{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:11px 13px;font:400 17px Lato,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:700 15px Lato,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.board{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.goal{font:700 20px "Baloo 2",sans-serif;margin:0}
.tokens{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tk{width:58px;height:58px;border-radius:50%;border:3px dashed var(--line);background:none;font-size:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tk.on{border:3px solid var(--sun);background:color-mix(in srgb,var(--sun) 22%,var(--surface));animation:pop .35s}
@keyframes pop{50%{transform:scale(1.2)}}
.reward{font-size:56px;line-height:1}
.primary{border:0;background:#1F8A6B;color:#fff;border-radius:999px;padding:14px 22px;font:700 17px Lato,sans-serif;cursor:pointer;width:100%}
.ghost{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:11px 18px;font:700 15px Lato,sans-serif;cursor:pointer}
.win{font:800 26px "Baloo 2",sans-serif;color:var(--accent);margin:0}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:14px 10px;text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.slot small{font:800 20px "Baloo 2",sans-serif;color:var(--accent)}
.slot .big{font-size:64px;line-height:1}
.slot b{font-size:17px}
.slot.done{opacity:.45}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px 2px;cursor:pointer;font:700 12.5px Lato,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px}
.pick button span{font-size:28px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.log{display:grid;gap:8px}
.entry{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:15px}
.entry time{color:var(--muted);font-weight:700;font-size:13px;display:block}
.summary{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:14px 16px;font-size:15.5px;line-height:1.5}
.note{color:var(--muted);font-size:14px;margin:0;text-align:center}
.hint{color:var(--muted);font-weight:700;margin:0;text-align:center;min-height:20px}
.homebtn{width:100%;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:var(--ink);border-radius:18px;padding:12px 14px;font:700 16px Lato,sans-serif;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left}
.homebtn span{font-size:26px}
.qrbox{background:#fff;border-radius:22px;padding:18px;display:flex;justify-content:center;margin:6px auto 0;width:fit-content;border:2px solid var(--line)}
.qrbox img,.qrbox canvas{width:240px!important;height:240px!important}
.qrlangs{display:flex;gap:8px;justify-content:center;margin:10px 0 4px}
.sharebtn{display:block;margin:14px auto 0;border:0;background:#1A3A8F;color:#fff;border-radius:999px;padding:13px 22px;font:700 16px Lato,sans-serif;cursor:pointer;transition:filter .15s,transform .12s}
.sharebtn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.sharenote{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 0;min-height:18px}
.qrsteps{margin:10px 0 0;padding-left:20px;display:grid;gap:5px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.help{flex:none;border:2px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:8px 13px;font:700 14px Lato,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px}
.help i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,25,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--bg);padding:6px 0 10px}
.sheet-head h2{font:800 24px/1.1 "Baloo 2",sans-serif;margin:0}
.sheet-head button{border:0;background:var(--soft);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.intro{color:var(--muted);margin:0 0 14px}
.hs{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.hs.cur{border-color:var(--accent)}
.hs h3{margin:0 0 6px;font:700 20px/1.15 "Baloo 2",sans-serif}
.hs .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}
.hs p{margin:0 0 8px}
.hs ol{margin:0 0 8px;padding-left:20px;display:grid;gap:4px}
.hs .tip{background:var(--soft);border-radius:12px;padding:9px 12px;font-size:15px;margin:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img class="alogo" src="https://www.jotform.com/uploads/enmanuelf59/form_files/Captura%20de%20pantalla%202026-04-22%20160244.69fbcf54529891.59675446.jpg" alt="Aliado Community Health">
    <div class="lang"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="es" aria-pressed="false">ES</button></div></div>
  <div class="head"><h1 data-t="title"></h1><button class="help" id="helpBtn" aria-haspopup="dialog"><i aria-hidden="true">?</i><span data-t="help"></span></button></div>
  <button class="homebtn" id="qrBtn"><span aria-hidden="true">🏠</span><div><b data-t="qrBtn"></b><br><small data-t="qrBtnSub" style="color:var(--muted)"></small></div></button>
  <div class="tabs" role="tablist" id="tabs"></div>

  <!-- Tokens -->
  <section id="p-tokens" style="display:flex;flex-direction:column;gap:12px">
    <div id="tkSetup" style="display:flex;flex-direction:column;gap:8px">
      <label class="label" for="behav" data-t="behavQ"></label>
      <input class="field" id="behav" maxlength="60">
      <p class="label" data-t="rewardQ"></p>
      <div class="pick" id="rewards"></div>
      <p class="label" data-t="howMany"></p>
      <div class="chips" id="nTokens"></div>
      <p class="hint" id="tkHint"></p>
      <button class="primary" id="tkStart" data-t="tkStart"></button>
    </div>
    <div id="tkPlay" hidden style="display:flex;flex-direction:column;gap:12px">
      <div class="board">
        <p class="goal" id="goal"></p>
        <div class="tokens" id="tokens"></div>
        <div class="reward" id="rewardBig"></div>
        <p class="win" id="win" hidden></p>
      </div>
      <button class="primary" id="tkReset" hidden data-t="tkAgain"></button>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="ghost" id="tkUndo" data-t="undo"></button>
        <button class="ghost" id="tkEdit" data-t="edit"></button>
      </div>
    </div>
  </section>

  <!-- First / Then -->
  <section id="p-ft" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="ft">
      <div class="slot" id="slotF"><small data-t="first"></small><div class="big" id="fE">❔</div><b id="fL"></b></div>
      <div class="slot" id="slotT"><small data-t="then"></small><div class="big" id="tE">❔</div><b id="tL"></b></div>
    </div>
    <button class="primary" id="ftDone" data-t="ftDone"></button>
    <p class="label" data-t="pickFirst"></p>
    <div class="pick" id="pickF"></div>
    <p class="label" data-t="pickThen"></p>
    <div class="pick" id="pickT"></div>
  </section>

  <!-- ABC -->
  <section id="p-abc" hidden style="display:flex;flex-direction:column;gap:10px">
    <p class="label" data-t="aQ"></p><div class="chips" id="cA"></div>
    <p class="label" data-t="bQ"></p><div class="chips" id="cB"></div>
    <p class="label" data-t="cQ"></p><div class="chips" id="cC"></div>
    <p class="hint" id="abcHint"></p>
    <button class="primary" id="abcSave" data-t="abcSave"></button>
    <div class="log" id="log"></div>
  </section>

  <!-- Summary -->
  <section id="p-sum" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="summary" id="summary"></div>
    <button class="primary" id="copy" data-t="copy"></button>
    <p class="note" id="copied"></p>
  </section>
</div>
<div class="sheet-bg" id="qrBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="qrT">
    <div class="sheet-head"><h2 id="qrT"></h2><button id="qrClose" aria-label="Close">✕</button></div>
    <p class="intro" id="qrP"></p>
    <p class="label" id="qrLangL" style="text-align:center"></p>
    <div class="qrlangs" id="qrLangs"></div>
    <div class="qrbox" id="qrBox"></div>
    <button class="sharebtn" id="qrShare"></button><p class="sharenote" id="qrNote"></p>
    <ol class="qrsteps" id="qrSteps"></ol>
  </div>
</div>
<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hT">
    <div class="sheet-head"><h2 id="hT"></h2><button id="hClose" aria-label="Cerrar">✕</button></div>
    <div id="hBody"></div>
  </div>
</div>

 sum:{es:["📋 Resumen","Junta todo lo que pasó en la sesión en un párrafo en inglés, listo para la nota de progreso.",
  ["Al final de la sesión, abre esta pestaña.","Revisa el texto y toca \u201cCopiar resumen\u201d.","Pégalo en tu nota y complétalo con tus propias observaciones."],
  "Copia el resumen antes de cerrar la página, porque no se guarda."],
  en:["📋 Summary","Puts everything from the session into one paragraph in English, ready for the progress note.",
  ["At the end of the session, open this tab.","Review the text and tap \u201cCopy summary\u201d.","Paste it into your note and add your own observations."],
  "Copy the summary before closing the page, because it isn't saved."]}};
function renderHelp(){const u=UI[lang];$("hT").textContent=u.hTitle;$("hClose").setAttribute("aria-label",lang==="es"?"Cerrar":"Close");
 const order=[tab,...["tokens","ft","abc","sum"].filter(k=>k!==tab)];
 $("hBody").innerHTML=`<p class="intro">${u.intro}</p>`+order.map(k=>{const [t,g,steps,tip]=HELP[k][lang];
  return `<div class="hs${k===tab?" cur":""}">${k===tab?`<span class="tag">${u.nowL}</span>`:""}<h3>${t}</h3><p><b>${u.goalL}:</b> ${g}</p><p><b>${u.howL}:</b></p><ol>${steps.map(s=>`<li>${s}</li>`).join("")}</ol><p class="tip">💡 ${tip}</p></div>`;}).join("");}
let lang="en",tab="tokens",reward=null,nTk=4,got=0,rounds=0,behav="",ftF=null,ftT=null,ftDone=0,sel={A:null,B:null,C:null},log=[],tokensUsed=false;
const $=id=>document.getElementById(id), L=x=>x[lang];
function tabs(){const T=[["tokens","⭐","tTokens"],["ft","➡️","tFt"],["abc","📝","tAbc"],["sum","📋","tSum"]];
 $("tabs").innerHTML="";T.forEach(([k,e,t])=>{const b=document.createElement("button");b.setAttribute("role","tab");b.setAttribute("aria-selected",k===tab);
 b.innerHTML=`<span aria-hidden="true">${e}</span>${UI[lang][t]}`;b.onclick=()=>{tab=k;show();};$("tabs").appendChild(b);});}
function show(){["tokens","ft","abc","sum"].forEach(k=>$("p-"+k).hidden=k!==tab);tabs();if(tab==="sum")renderSum();}
function grid(el,arr,cur,on){el.innerHTML="";arr.forEach(([e,l],i)=>{const b=document.createElement("button");b.setAttribute("aria-pressed",cur===i);b.innerHTML=`<span aria-hidden="true">${e}</span>${L(l)}`;b.onclick=()=>on(i);el.appendChild(b);});}
function chips(el,arr,cur,on){el.innerHTML="";arr.forEach(([k,l])=>{const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",cur===k);b.textContent=L(l);b.onclick=()=>on(k);el.appendChild(b);});}
function paint(){document.documentElement.lang=lang;document.title=UI[lang].title;
 document.querySelectorAll("[data-t]").forEach(el=>el.textContent=UI[lang][el.dataset.t]);
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
 $("behav").placeholder=UI[lang].behavPh;
 grid($("rewards"),REWARDS,reward,i=>{reward=i;paint();});
 chips($("nTokens"),[3,4,5].map(n=>[n,{es:n+" ⭐",en:n+" ⭐"}]),nTk,n=>{nTk=n;paint();});
 grid($("pickF"),TASKS,ftF,i=>{ftF=i;ftUpd();paint();}); grid($("pickT"),REWARDS,ftT,i=>{ftT=i;ftUpd();paint();});
 ["A","B","C"].forEach(k=>chips($("c"+k),ABC[k],sel[k],v=>{sel[k]=v;$("abcHint").textContent="";paint();}));
 renderBoard();ftUpd();renderLog();show();}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;paint();});
/* tokens */
$("tkStart").onclick=()=>{behav=$("behav").value.trim();if(!behav||reward===null){$("tkHint").textContent=UI[lang].needSetup;return;}
 $("tkHint").textContent="";got=0;tokensUsed=true;$("tkSetup").hidden=true;$("tkPlay").hidden=false;renderBoard();};
function renderBoard(){if(reward===null)return;$("goal").textContent=behav;$("rewardBig").textContent=REWARDS[reward][0];
 $("tokens").innerHTML="";for(let i=0;i<nTk;i++){const b=document.createElement("button");b.className="tk"+(i<got?" on":"");b.textContent=i<got?"⭐":"";
 b.setAttribute("aria-label",(i+1)+"");b.onclick=()=>{if(got<nTk&&i===got){got++;if(got===nTk)rounds++;renderBoard();}};$("tokens").appendChild(b);}
 const full=got>=nTk;$("win").hidden=!full;$("tkReset").hidden=!full;$("win").textContent=`${UI[lang].earned} ${L(REWARDS[reward][1])}!`;}
$("tkReset").onclick=()=>{got=0;renderBoard();};
$("tkUndo").onclick=()=>{if(got>0){if(got===nTk)rounds--;got--;renderBoard();}};
$("tkEdit").onclick=()=>{$("tkSetup").hidden=false;$("tkPlay").hidden=true;};
/* first then */
function ftUpd(){$("fE").textContent=ftF!==null?TASKS[ftF][0]:"❔";$("fL").textContent=ftF!==null?L(TASKS[ftF][1]):"";
 $("tE").textContent=ftT!==null?REWARDS[ftT][0]:"❔";$("tL").textContent=ftT!==null?L(REWARDS[ftT][1]):"";}
$("ftDone").onclick=()=>{if(ftF===null||ftT===null)return;ftDone++;$("slotF").classList.add("done");setTimeout(()=>$("slotF").classList.remove("done"),2500);};
/* abc */
$("abcSave").onclick=()=>{if(!sel.A||!sel.B||!sel.C){$("abcHint").textContent=UI[lang].needAbc;return;}
 log.unshift({t:new Date(),...sel});sel={A:null,B:null,C:null};paint();};
const lab=(k,v)=>L(ABC[k].find(x=>x[0]===v)[1]);
function renderLog(){$("log").innerHTML=log.map(e=>`<div class="entry"><time>${e.t.toLocaleTimeString(lang,{hour:"numeric",minute:"2-digit"})}</time>${lab("A",e.A)} → <b>${lab("B",e.B)}</b> → ${lab("C",e.C)}</div>`).join("");}
/* summary (always English for the note) */
const en=(k,v)=>ABC[k].find(x=>x[0]===v)[1].en.toLowerCase();
function topOf(k){const c={};log.forEach(e=>c[e[k]]=(c[e[k]]||0)+1);const m=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return m?`${en(k,m[0])} (${m[1]})`:"";}
function renderSum(){const p=[];
 if(tokensUsed&&reward!==null){p.push(`BA implemented a token economy targeting "${behav}". Youth earned ${rounds} reward(s) (${REWARDS[reward][1].en.toLowerCase()}) by completing ${nTk}-token rounds${got>0&&got<nTk?`, with ${got} of ${nTk} tokens earned in the current round`:""}.`);}
 if(ftF!==null&&ftT!==null){p.push(`A First/Then board was used (first: ${TASKS[ftF][1].en.toLowerCase()}; then: ${REWARDS[ftT][1].en.toLowerCase()}) to support task completion${ftDone?`; youth completed the task ${ftDone} time(s)`:""}.`);}
 if(log.length){p.push(`ABC data were collected for ${log.length} incident(s). Most frequent antecedent: ${topOf("A")}. Most frequent behavior: ${topOf("B")}. Most frequent consequence: ${topOf("C")}.`);}
 $("summary").textContent=p.length?p.join(" "):UI[lang].nothing;$("copy").hidden=!p.length;$("copied").textContent="";}
$("copy").onclick=async()=>{const t=$("summary").textContent;try{await navigator.clipboard.writeText(t);}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();}$("copied").textContent=UI[lang].copied;};
let qrLang="en";
function renderQR(){const u=UI[lang];$("qrT").textContent=u.qrT;$("qrShare").textContent=u.qrShareL;$("qrNote").textContent="";$("qrP").textContent=u.qrP;$("qrLangL").textContent=u.qrLangL;
 $("qrSteps").innerHTML=u.qrSteps.map(x=>`<li>${x}</li>`).join("");
 $("qrLangs").innerHTML="";[["en","English"],["es","Español"]].forEach(([k,l])=>{const b=document.createElement("button");b.className="chip";b.textContent=l;b.setAttribute("aria-pressed",qrLang===k);b.onclick=()=>{qrLang=k;renderQR();};$("qrLangs").appendChild(b);});
 const url="https://enmanuelf-ai.github.io/billing/herramientas-terapeuticas/tabla-casa.html?lang="+qrLang;$("qrBox").innerHTML="";
 try{new QRCode($("qrBox"),{text:url,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});$("qrBox").removeAttribute("title");}catch(e){$("qrBox").textContent="QR not available";}}
$("qrShare").onclick=async()=>{const url="https://enmanuelf-ai.github.io/billing/herramientas-terapeuticas/tabla-casa.html?lang="+qrLang;const text=(qrLang==="es"?"¡Hola! Aquí tiene su tabla de estrellas para usar en casa con su hijo esta semana. Su terapeuta la revisará con usted en la próxima sesión: ":"Hi! Here is your star chart to use at home with your child this week. Your therapist will review it with you at the next session: ")+url;
 try{if(navigator.share){await navigator.share({text});return;}}catch(e){if(e&&e.name==="AbortError")return;}
 try{await navigator.clipboard.writeText(text);}catch(e){const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();}
 $("qrNote").textContent=UI[lang].qrCopied;};
$("qrBtn").onclick=()=>{qrLang=lang;renderQR();$("qrBg").hidden=false;$("qrClose").focus();};
$("qrClose").onclick=()=>{$("qrBg").hidden=true;$("qrBtn").focus();};
$("qrBg").onclick=e=>{if(e.target.id==="qrBg")$("qrClose").click();};
$("helpBtn").onclick=()=>{renderHelp();$("sheetBg").hidden=false;$("sheetBg").querySelector(".sheet").scrollTop=0;$("hClose").focus();};
$("hClose").onclick=()=>{$("sheetBg").hidden=true;$("helpBtn").focus();};
$("sheetBg").onclick=e=>{if(e.target.id==="sheetBg")$("hClose").click();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheetBg").hidden)$("hClose").click();});
const _paint=paint;paint=function(){_paint();if(!$("sheetBg").hidden)renderHelp();};
paint();
</script>
</body>
</html>
