<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visual timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FF; --surface:#FFFFFF; --ink:#16224A; --muted:#5A6688;
  --navy:#1A3A8F; --line:#D5DEF5; --soft:#E3EAFB; --acc:#5FB3E8; --pie:#EF6461;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0F1530;--surface:#1A2246;--ink:#EEF2FF;--muted:#A8B3D6;--navy:#8FA9FF;--line:#2C3766;--soft:#232D58;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0F1530;--surface:#1A2246;--ink:#EEF2FF;--muted:#A8B3D6;--navy:#8FA9FF;--line:#2C3766;--soft:#232D58;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Lato,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:14px 18px 28px;display:flex;flex-direction:column;min-height:100vh;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.alogo{display:block;height:44px;width:auto;border-radius:10px;background:#fff;padding:2px 6px}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font:700 14px Lato,sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(22,34,74,.15)}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
h1{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1;margin:0}
.lbl{font:700 14px Lato,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;font:700 15px Lato,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--acc);background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.times{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.times button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:10px 0;font:800 18px "Baloo 2",sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
.times button small{display:block;font:700 11px Lato,sans-serif;color:var(--muted)}
.times button:hover{border-color:var(--acc);background:var(--soft)}
.times button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.times button[aria-pressed="true"] small{color:#dfe6ff}

.clock{position:relative;width:min(300px,76vw);aspect-ratio:1;margin:4px auto 0}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.face .ico{font-size:clamp(40px,12vw,56px);line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.face .left{margin-top:4px;font:800 clamp(30px,9vw,40px)/1 "Baloo 2",sans-serif;background:var(--surface);padding:2px 12px;border-radius:14px}
.msg{text-align:center;font:800 22px "Baloo 2",sans-serif;min-height:30px;margin:0}
.msg.warn{color:#D9480F}.msg.done{color:#2FA77A}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.next{border:0;background:#1A3A8F;color:#fff;border-radius:999px;padding:15px 22px;font:700 18px Lato,sans-serif;cursor:pointer;transition:background .15s}
.next:hover{background:#244BB0}
.ghost{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:13px 16px;font:700 16px Lato,sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
.ghost:hover{border-color:var(--acc);background:var(--soft)}
.share{border:2px dashed #C2185B;background:#FFF7FA;color:#C2185B;border-radius:999px;padding:12px 16px;font:700 16px Lato,sans-serif;cursor:pointer;transition:background .15s}
.share:hover{background:#FCE4EF}
.toast{min-height:20px;text-align:center;color:#2FA77A;font-weight:700;margin:0;font-size:15px}
.fam{background:var(--soft);border-radius:16px;padding:10px 14px;font-size:15px;color:var(--muted);margin:0}

:root{--hc:#1A3A8F}
.hbtn{border:2px solid var(--line);background:var(--surface);color:var(--hc);border-radius:999px;padding:5px 11px 5px 6px;font:700 13.5px Lato,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px}
.hbtn:hover{background:var(--soft)}
.hbtn i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--hc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.hsheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.45);display:flex;align-items:flex-end;justify-content:center}
.hsheet{background:var(--bg);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.hsheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--bg);padding:6px 0 10px}
.hsheet-head h2{font:800 24px/1.1 "Baloo 2",sans-serif;margin:0}
.hsheet-head button{border:0;background:var(--soft);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.hsec{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px;font-size:16px;line-height:1.5}
.hsec h3{margin:0 0 6px;font:700 19px/1.15 "Baloo 2",sans-serif;color:var(--hc)}
.hsec p{margin:0}.hsec ol{margin:0;padding-left:20px;display:grid;gap:5px}
.hsec.tip{background:var(--soft);border-color:transparent}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div style="display:flex;align-items:center;gap:10px"><img class="alogo" src="https://www.jotform.com/uploads/enmanuelf59/form_files/Captura%20de%20pantalla%202026-04-22%20160244.69fbcf54529891.59675446.jpg" alt="Aliado Community Health"><button class="hbtn" id="helpBtn" aria-haspopup="dialog"><i aria-hidden="true">?</i><span id="helpLbl">Help</span></button></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>

  <h1 data-t="title"></h1>
  <p class="fam" id="famNote" hidden data-t="fam"></p>
  <div><p class="lbl" data-t="whatL"></p><div class="acts" id="acts"></div></div>
  <div><p class="lbl" data-t="howL"></p><div class="times" id="times"></div></div>

  <div class="clock">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="48" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
      <circle id="pie" cx="50" cy="50" r="23" fill="none" stroke="var(--pie)" stroke-width="46" stroke-dasharray="144.5 144.5" stroke-dashoffset="0"/>
    </svg>
    <div class="face"><div class="ico" id="ico"></div><div class="left" id="left"></div></div>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="ctrl">
    <button class="ghost" id="reset" data-t="reset"></button>
    <button class="next" id="go" data-t="start"></button>
  </div>
  <button class="share" id="share" data-t="share"></button>
  <p class="toast" id="toast" aria-live="polite"></p>
</div>

<script>
const UI={
 en:{title:"Visual timer",whatL:"What's the timer for?",howL:"How long?",start:"▶ Start",pause:"⏸ Pause",resume:"▶ Resume",reset:"↺ Reset",
  oneLeft:"1 minute left!",done:"Time's up! 🎉",share:"📤 Share with the family",copied:"Link copied. Paste it in a text or WhatsApp to the parent.",
  fam:"Your therapist shared this timer with you. Pick the activity and the minutes, then press Start.",min:"min"},
 es:{title:"Timer visual",whatL:"¿Para qué es el timer?",howL:"¿Cuánto tiempo?",start:"▶ Empezar",pause:"⏸ Pausa",resume:"▶ Seguir",reset:"↺ Reiniciar",
  oneLeft:"¡Queda 1 minuto!",done:"¡Se acabó el tiempo! 🎉",share:"📤 Compartir con la familia",copied:"Link copiado. Pégalo en un texto o WhatsApp al padre.",
  fam:"Su terapeuta le compartió este timer. Escoja la actividad y los minutos, y toque Empezar.",min:"min"}
};
const ACTS=[{id:"clean",e:"🧸",en:"Clean up",es:"Recoger",c:"#8ED6B4"},{id:"screen",e:"📱",en:"Screen time",es:"Pantalla",c:"#9CC8F7"},
 {id:"ready",e:"👟",en:"Get ready",es:"Alistarse",c:"#FFC93C"},{id:"break",e:"🧃",en:"Break",es:"Descanso",c:"#C3B2F7"},
 {id:"homework",e:"📚",en:"Homework",es:"Tarea",c:"#FFB4A2"},{id:"calm",e:"😌",en:"Calm down",es:"Calmarse",c:"#7CC6F2"}];
const TIMES=[1,2,5,10,15];
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
const FAMILY=P.get("f")==="1";
let lang=P.get("lang")==="es"?"es":"en",act=ACTS[0],mins=5,total=300,left=300,timer=null,endAt=0,warned=false;
const U=()=>UI[lang];
const CIRC=144.5;
function fmt(s){const m=Math.floor(s/60),x=Math.max(0,s%60);return m+":"+String(x).padStart(2,"0");}
function draw(){
  const frac=total?left/total:0;
  $("pie").setAttribute("stroke-dasharray",(CIRC*frac).toFixed(2)+" "+CIRC);
  document.documentElement.style.setProperty("--pie",left<=60&&left>0&&total>60?"#F08A5D":act.c==="#FFC93C"?"#F5B700":act.c);
  $("left").textContent=fmt(Math.ceil(left));$("ico").textContent=act.e;
}
function paint(){
  document.documentElement.lang=lang;document.title=U().title;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=U()[el.dataset.t];if(typeof v==="string")el.textContent=v;});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("acts").innerHTML="";ACTS.forEach(a=>{const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",a.id===act.id);
    b.innerHTML=`<span aria-hidden="true">${a.e}</span>${a[lang]}`;b.onclick=()=>{act=a;paint();};$("acts").appendChild(b);});
  $("times").innerHTML="";TIMES.forEach(t=>{const b=document.createElement("button");b.setAttribute("aria-pressed",t===mins);
    b.innerHTML=`${t}<small>${U().min}</small>`;b.onclick=()=>{mins=t;reset();paint();};$("times").appendChild(b);});
  $("go").textContent=timer?U().pause:(left<total&&left>0?U().resume:U().start);
  $("famNote").hidden=!FAMILY;$("share").hidden=FAMILY;
  draw();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;paint();});
function reset(){clearInterval(timer);timer=null;total=mins*60;left=total;warned=false;$("msg").textContent="";$("msg").className="msg";}
function beep(n){try{const C=new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=C.createOscillator(),g=C.createGain();
  o.type="sine";o.frequency.value=660+i*220;g.gain.setValueAtTime(0.0001,C.currentTime+i*.35);g.gain.exponentialRampToValueAtTime(.25,C.currentTime+i*.35+.03);
  g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+i*.35+.3);o.connect(g).connect(C.destination);o.start(C.currentTime+i*.35);o.stop(C.currentTime+i*.35+.32);}}catch(e){}}
$("go").onclick=()=>{
  if(timer){clearInterval(timer);timer=null;paint();return;}
  if(left<=0)reset();
  endAt=Date.now()+left*1000;
  if(left===total&&window.ttLog)ttLog("complete",{answer:act.id+" "+mins+"m"});
  timer=setInterval(()=>{left=Math.max(0,(endAt-Date.now())/1000);
    if(!warned&&total>60&&left<=60){warned=true;$("msg").textContent=U().oneLeft;$("msg").className="msg warn";beep(1);}
    if(left<=0){clearInterval(timer);timer=null;$("msg").textContent=U().done;$("msg").className="msg done";beep(3);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}paint();}
    draw();},200);
  paint();
};
$("reset").onclick=()=>{reset();paint();};
$("share").onclick=async()=>{
  const url=location.origin+location.pathname+"?f=1&lang="+lang;
  const text=(lang==="es"?"¡Hola! Aquí tiene el timer visual para usar en casa con su hijo (para recoger, pantalla, alistarse…): ":"Hi! Here is the visual timer to use at home with your child (clean up, screen time, getting ready…): ")+url;
  if(window.ttLog)ttLog("share_link");
  try{if(navigator.share){await navigator.share({text});return;}}catch(e){}
  try{await navigator.clipboard.writeText(text);}catch(e){const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove();}
  $("toast").textContent=U().copied;};
reset();paint();
</script>

<div class="hsheet-bg" id="hBg" hidden><div class="hsheet" role="dialog" aria-modal="true" aria-labelledby="hT2"><div class="hsheet-head"><h2 id="hT2"></h2><button id="hX" aria-label="Close">✕</button></div><div id="hB2"></div></div></div>
<script>
(function(){
const H={es:{title:"¿Cómo funciona el timer?",goal:"Hace visible el tiempo para que las transiciones (dejar la pantalla, recoger, alistarse) no lleguen de sorpresa. Los niños entienden mejor un pedazo de color que se achica que \"5 minutos más\".",
 how:["Escoge para qué es el timer: el dibujo aparece en el centro del reloj.","Escoge los minutos y toca <b>Empezar</b>. El color se va achicando.","Cuando queda 1 minuto el reloj cambia de color y suena un aviso suave; al terminar suena otra vez.","Toca <b>Compartir con la familia</b> para mandarle el timer al padre por texto o WhatsApp. En la versión de la familia no aparece el botón de compartir."],
 tips:["Avisa antes de empezar: \"cuando el color se acabe, guardamos la tablet\". El reloj hace de árbitro, no tú.","Úsalo igual todas las veces para que el niño aprenda la rutina.","Con el Kit de conducta: primero el timer de tarea, después el premio."]},
 en:{title:"How does the timer work?",goal:"Makes time visible so transitions (ending screen time, cleaning up, getting ready) don't come as a surprise. Children understand a shrinking slice of color better than \"5 more minutes\".",
 how:["Pick what the timer is for: the picture shows in the middle of the clock.","Pick the minutes and tap <b>Start</b>. The color slice shrinks.","With 1 minute left the clock changes color and plays a soft sound; it sounds again at the end.","Tap <b>Share with the family</b> to send the timer to the parent by text or WhatsApp. The family version has no share button."],
 tips:["Announce it before starting: \"when the color is gone, we put the tablet away\". The clock is the referee, not you.","Use it the same way every time so the child learns the routine.","Pair it with the Behavior kit: first the homework timer, then the reward."]}};
const L={es:{btn:"Ayuda",goal:"Para qué sirve",how:"Cómo usarlo",close:"Cerrar"},en:{btn:"Help",goal:"What it's for",how:"How to use it",close:"Close"}};
const g=id=>document.getElementById(id),lg=()=>document.documentElement.lang==="es"?"es":"en";
function render(){const l=lg(),d=H[l],u=L[l];g("helpLbl").textContent=u.btn;g("hT2").textContent=d.title;g("hX").setAttribute("aria-label",u.close);
 let h=`<div class="hsec"><h3>${u.goal}</h3><p>${d.goal}</p></div><div class="hsec"><h3>${u.how}</h3><ol>${d.how.map(x=>`<li>${x}</li>`).join("")}</ol></div>`;
 d.tips.forEach(t=>h+=`<div class="hsec tip"><p>💡 ${t}</p></div>`);g("hB2").innerHTML=h;}
g("helpBtn").onclick=()=>{render();g("hBg").hidden=false;g("hX").focus();};
g("hX").onclick=()=>{g("hBg").hidden=true;g("helpBtn").focus();};
g("hBg").onclick=e=>{if(e.target.id==="hBg")g("hX").click();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!g("hBg").hidden)g("hX").click();});
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
render();
})();
</script>
<script>
/* TT_LOG: anonymous usage log (no client data) */
(function(){
let FLOWP=null;const getFlow=()=>{if(window.TT_FLOW)return Promise.resolve(window.TT_FLOW);if(FLOWP)return FLOWP;
 let c=null;try{c=sessionStorage.getItem("tt-flow")}catch(e){}if(c)return FLOWP=Promise.resolve(c);
 return FLOWP=fetch("tt-flow.txt",{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{t=(t||"").trim();try{if(t)sessionStorage.setItem("tt-flow",t)}catch(e){}return t;}).catch(()=>"");};
const P=new URLSearchParams(location.search);
let C=P.get("c")||"";try{if(C)sessionStorage.setItem("tt-c",C);else C=sessionStorage.getItem("tt-c")||"";}catch(e){}
const MODE=P.get("f")==="1"?"family":"therapist";
window.ttLog=function(event,extra){
 const body=Object.assign({event,tool:'Visual timer',clinician:C,mode:MODE,lang:document.documentElement.lang||"en",answer:"",comment:""},extra||{});
 getFlow().then(FLOW=>{if(!FLOW||FLOW.indexOf("https://")!==0)return;try{fetch(FLOW,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),keepalive:true}).catch(()=>{});}catch(e){}});};
ttLog("open");
})();
</script>
</body>
</html>
