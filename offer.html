<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Offer of Employment – Aliado Community Health</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3ef;font-family:Arial,Helvetica,sans-serif;color:#33404d}
.box{max-width:780px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 30px rgba(0,0,0,.06)}
.logo{text-align:center;padding:26px 16px 6px}.logo img{width:120px;height:120px}
.slogan{text-align:center;font-size:11px;font-weight:700;letter-spacing:1.6px;color:#3a8db8;padding:0 16px 18px}
.hero{background:#1f3a5f;color:#fff;text-align:center;padding:30px 20px}.hero .k{font-size:11px;letter-spacing:3px;color:#9fd39a;font-weight:700}
.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:28px;margin:10px 0 8px;line-height:1.2}.hero p{color:#d3deea;margin:0;font-size:15px;line-height:1.5}
.bar{height:5px;background:#4f8a4b}
.sum{margin:20px 16px;background:#f6f9f7;border:1px solid #dfe8e2;border-radius:14px;padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;font-size:14px}
.sum span{display:block;font-size:11px;color:#6b7785;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}.sum b{color:#1f3a5f}
.lt{margin:0 16px;border:1px solid #e3e8f0;border-radius:14px;overflow:hidden}
.lt iframe{display:block;width:100%;border:0;height:600px}
.hint{margin:10px 16px 0;font-size:12.5px;color:#6b7785;text-align:center}
.sign{margin:22px 16px;border:2px solid #1f3a5f;border-radius:16px;padding:18px;transition:opacity .3s}
.sign.lock{opacity:.45;pointer-events:none}
.sign .t{font-weight:700;color:#1f3a5f;font-size:17px;margin-bottom:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45;margin-bottom:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:#4f8a4b;flex:none;margin-top:1px}
.f{font-size:11px;color:#6b7785;letter-spacing:1px;margin:12px 0 5px;font-weight:700}
.in{width:100%;border:1px solid #cfd8e3;border-radius:10px;padding:12px;font-size:16px;color:#1e2a3a;background:#fff}
.in:focus{outline:2px solid #4f8a4b;border-color:#4f8a4b}
.padw{position:relative;border:1px dashed #9fb1c6;border-radius:12px;background:#fbfcfe;touch-action:none}
canvas{display:block;width:100%;height:150px;border-radius:12px;cursor:crosshair}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa8b8;font-size:14px;pointer-events:none}
.clr{position:absolute;right:10px;bottom:8px;font-size:12px;color:#1f5fa8;background:none;border:0;cursor:pointer;font-weight:700;padding:4px}
.clr:hover{text-decoration:underline}
.go{margin-top:18px;width:100%;background:#4f8a4b;color:#fff;border:0;border-radius:30px;padding:16px;font-weight:700;font-size:16.5px;cursor:pointer;transition:background .15s,transform .1s}
.go:hover{background:#3f7a3c}.go:active{transform:scale(.99)}.go:disabled{background:#a9bfa7;cursor:not-allowed}
.err{color:#b42318;font-size:13.5px;margin-top:10px;font-weight:700;display:none}
.msg{padding:40px 24px;text-align:center}.msg .ic{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
.msg h2{font-family:Georgia,serif;color:#1f3a5f;margin:0 0 10px;font-size:24px}.msg p{font-size:15px;line-height:1.6;margin:0 auto 10px;max-width:520px}
.spin{width:40px;height:40px;border:4px solid #dfe8e2;border-top-color:#4f8a4b;border-radius:50%;animation:s 1s linear infinite;margin:50px auto 14px}@keyframes s{to{transform:rotate(360deg)}}
.foot{background:#1f3a5f;color:#b3c4d8;text-align:center;font-size:12px;padding:22px;line-height:1.7}.foot i{color:#fff;font-family:Georgia,serif;font-size:15px}
@media(max-width:480px){.sum{grid-template-columns:1fr 1fr;font-size:13px}.hero h1{font-size:24px}}
</style></head><body><div class="box">
<div class="logo"><img src="https://www.jotform.com/uploads/enmanuelf59/form_files/Aliado%20Logo.6a445020d28805.86370275.png" alt="Aliado Community Health"></div>
<div class="slogan">PARTNERING WITH FAMILIES TO BUILD RESILIENCE AND HOPE</div>
<div id="app"><div class="spin"></div><p style="text-align:center;color:#6b7785">Loading your offer&hellip;</p></div>
<div class="foot"><i>Together, we make a difference.</i><br>Aliado Community Health, LLC &middot; 116 Terrace Ave, Lodi, NJ 07644<br>info@aliadocommunityhealth.com &middot; (201) 620-6440</div>
</div>
<script>
(function(){
var API="https://default5c737bedc35d48c39a6d89e766c7c7.03.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/10/workflows/e716989d0e7b458aab4ace89aecf86fe/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=M-Y3rg4-l9Y-LxK_Jwffuz_4K1rjMy0yYOdIfw7hXjw";
var h=location.hash.replace(/^#/,''); var m=h.match(/(?:^|&)t=([A-Za-z0-9]+)/); var T=m?m[1]:'';
try{history.replaceState(null,'',location.pathname);}catch(e){}
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function msg(color,icon,title,text){app.innerHTML='<div class="bar"></div><div class="msg"><div class="ic" style="background:'+color+'">'+icon+'</div><h2>'+title+'</h2>'+text+'</div>';}
function call(body){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}).then(function(r){return r.json();});}
var CONTACT='<p>Questions? Call us at <b>(201) 620-6440</b> or email <b>info@aliadocommunityhealth.com</b>.</p>';
if(!T){msg('#b42318','!','Link not valid','<p>This link is incomplete. Please open it again from your email.</p>'+CONTACT);return;}
call({t:T,a:'load'}).then(function(d){
 if(!d||!d.ok){msg('#b42318','!','Offer not found','<p>We couldn&rsquo;t find this offer. The link may be incomplete or no longer active.</p>'+CONTACT);return;}
 var sak=d.role==='sak';
 if(d.cancelled){msg('#6b7785','&times;','This offer is no longer active','<p>This offer was withdrawn.</p>'+CONTACT);return;}
 if(d.mine){msg('#4f8a4b','&#10003;','Already signed','<p>'+(sak?'You already signed this offer.':'You already signed your offer. Thank you!')+'</p>'+(sak?'':'<p>You&rsquo;ll receive a copy of the fully signed letter by email once all signatures are complete.</p>'));return;}
 if(d.expired&&!sak){msg('#b42318','!','This offer has expired','<p>The deadline to sign this offer was <b>'+esc(d.signBy)+'</b>.</p><p>If you are still interested, please contact us and we&rsquo;ll be happy to help.</p>'+CONTACT);return;}
 render(d,sak);
}).catch(function(){msg('#b42318','!','Something went wrong','<p>We couldn&rsquo;t load your offer right now. Please try again in a few minutes.</p>'+CONTACT);});
function render(d,sak){
 var first=esc(d.first||'');
 app.innerHTML='<div class="hero"><div class="k">'+(sak?'OFFER SIGNATURE':'OFFER OF EMPLOYMENT')+'</div><h1>'+(sak?'Offer for '+esc(d.name):'Welcome, '+first)+'</h1><p>'+(sak?'Review the letter and sign as Clinical Director.':'Please read your offer and sign at the bottom.')+'</p></div><div class="bar"></div>'+
 '<div class="sum"><div><span>Position</span><b>'+esc(d.position)+'</b></div><div><span>Status</span><b>'+esc(d.cls)+'</b></div><div><span>Pay</span><b>'+esc(d.pay)+'</b></div><div><span>Sign by</span><b>'+esc(d.signBy)+'</b></div></div>'+
 '<div class="lt"><iframe id="fr" title="Offer letter" sandbox="allow-same-origin"></iframe></div><div class="hint" id="hint">Scroll to read the full letter &mdash; the signature unlocks at the end.</div><div id="end"></div>'+
 '<div class="sign lock" id="sg"><div class="t">'+(sak?'Sign as Clinical Director':'Accept your offer')+'</div>'+
 '<label class="chk"><input type="checkbox" id="ck"><span>'+(sak?'I have reviewed this Offer of Employment and sign on behalf of Aliado Community Health.':'I have read, understood, and accepted the terms outlined in this Offer of Employment.')+'</span></label>'+
 '<div class="f">FULL NAME</div><input class="in" id="nm" autocomplete="name" value="'+(sak?'Dr. Sakima Gonzalez':esc(d.name))+'">'+
 '<div class="f">SIGNATURE</div><div class="padw"><canvas id="cv"></canvas><div class="ph" id="ph">Sign here with your finger or mouse</div><button class="clr" id="clr" type="button">Clear</button></div>'+
 '<div class="f">DATE</div><input class="in" id="dt" readonly value="'+new Date().toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'})+'">'+
 '<button class="go" id="go" disabled>Sign '+(sak?'Offer':'My Offer')+' &rarr;</button><div class="err" id="er"></div></div>';
 var fr=document.getElementById('fr');
 var css='<style>@media screen{.foot,.wm{display:none!important}body{margin:18px 20px!important;font-size:14px!important}.pg>tfoot{display:none}.head img{width:90px!important;height:90px!important}}</style>';
 fr.srcdoc=String(d.letter||'').replace('</head>',css+'</head>');
 fr.onload=function(){try{var b=fr.contentDocument.documentElement;fr.style.height=(b.scrollHeight+10)+'px';}catch(e){}};
 var sg=document.getElementById('sg'),unlocked=false;
 function unlock(){if(unlocked)return;unlocked=true;sg.classList.remove('lock');document.getElementById('hint').style.display='none';}
 if('IntersectionObserver' in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)unlock();});}).observe(document.getElementById('end'));}else unlock();
 // signature pad
 var cv=document.getElementById('cv'),ctx,drawn=false,down=false,last=null;
 function size(){var r=cv.getBoundingClientRect();cv.width=Math.round(r.width);cv.height=150;ctx=cv.getContext('2d');ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1f3a5f';drawn=false;document.getElementById('ph').style.display='flex';upd();}
 size();window.addEventListener('resize',function(){if(!drawn)size();});
 function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
 cv.addEventListener('pointerdown',function(e){down=true;last=pos(e);cv.setPointerCapture(e.pointerId);});
 cv.addEventListener('pointermove',function(e){if(!down)return;var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;if(!drawn){drawn=true;document.getElementById('ph').style.display='none';upd();}});
 ['pointerup','pointercancel','pointerleave'].forEach(function(ev){cv.addEventListener(ev,function(){down=false;});});
 document.getElementById('clr').onclick=size;
 var ck=document.getElementById('ck'),nm=document.getElementById('nm'),go=document.getElementById('go'),er=document.getElementById('er');
 function upd(){if(go)go.disabled=!(ck.checked&&drawn&&nm.value.trim().length>1);}
 ck.onchange=upd;nm.oninput=upd;
 function trimSig(){var w=cv.width,h=cv.height,data=ctx.getImageData(0,0,w,h).data,x0=w,y0=h,x1=0,y1=0;for(var y=0;y<h;y++)for(var x=0;x<w;x++){if(data[(y*w+x)*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(x1<x0)return cv.toDataURL('image/png');var p=6;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w,x1+p);y1=Math.min(h,y1+p);var c=document.createElement('canvas');c.width=x1-x0;c.height=y1-y0;c.getContext('2d').drawImage(cv,x0,y0,c.width,c.height,0,0,c.width,c.height);return c.toDataURL('image/png');}
 go.onclick=function(){go.disabled=true;go.innerHTML='Signing&hellip;';er.style.display='none';
  call({t:T,a:'sign',name:nm.value.trim(),sig:trimSig()}).then(function(r){
   if(r&&r.ok){window.scrollTo(0,0);msg('#4f8a4b','&#10003;',sak?'Signed. Thank you!':'Thank you, '+first+'!',sak?'<p>Your signature was added to the offer for <b>'+esc(d.name)+'</b>.</p>'+(r.completed?'<p>Both signatures are complete. The signed PDF is being saved and sent to the candidate.</p>':'<p>The signed PDF will be created automatically once the candidate signs.</p>'):'<p>Your offer has been signed. Welcome to the Aliado family!</p><p>'+(r.completed?'A copy of your fully signed offer letter is on its way to your email.':'You&rsquo;ll receive a copy of the fully signed letter by email once all signatures are complete.')+'</p><p>Our team will contact you soon about the next onboarding steps.</p>');}
   else{var t={already:'This offer was already signed.',expired:'This offer has expired.',cancelled:'This offer is no longer active.'}[r&&r.err]||'We couldn&rsquo;t save your signature. Please try again.';er.innerHTML=t;er.style.display='block';go.innerHTML='Sign '+(sak?'Offer':'My Offer')+' &rarr;';upd();}
  }).catch(function(){er.innerHTML='Connection problem. Please try again.';er.style.display='block';go.innerHTML='Sign '+(sak?'Offer':'My Offer')+' &rarr;';upd();});
 };
}
})();
</script>
</body></html>
