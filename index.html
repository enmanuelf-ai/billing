<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>My Billing Hours</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f6fa;color:#1f2a44}
.msg{max-width:420px;margin:80px auto;text-align:center;padding:0 20px}
.spin{width:36px;height:36px;border:4px solid #d9e0ec;border-top-color:#1f3a7a;border-radius:50%;margin:0 auto 16px;animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="msg" id="msg"><div class="spin"></div>Loading your billing hours...</div>
<script>
(function () {
var BASE = "https://default5c737bedc35d48c39a6d89e766c7c7.03.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/2fe1c1516e1d4076be0882b64dcb8268/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0";
var p = new URLSearchParams((location.hash || "").replace(/^#/, ""));
var k = p.get("k"), c = p.get("c");
var msg = document.getElementById("msg");
if (!k || !c) { msg.textContent = "This link is incomplete. Please contact Aliado support."; return; }
var url = BASE + "&sig=" + encodeURIComponent(k) + "&clinician=" + encodeURIComponent(c);
fetch(url, { method: "GET", referrerPolicy: "no-referrer" })
.then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
.then(function (h) { document.open(); document.write(h); document.close(); })
.catch(function () { msg.textContent = "We couldn't load your billing hours right now. Please try again in a moment."; });
})();
</script>
</body>
</html>
