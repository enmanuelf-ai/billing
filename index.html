<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>My Billing Hours</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f6fa;color:#1f2a44}
.msg{max-width:420px;margin:80px auto;text-align:center;padding:0 20px}
.spin{width:36px;height:36px;border:4px solid #d9e0ec;border-top-color:#1f3a7a;border-radius:50%;margin:0 auto 16px;animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="msg" id="msg"><div class="spin"></div>Loading your billing hours...</div>
<script>
(function () {
var BASE = "https://default5c737bedc35d48c39a6d89e766c7c7.03.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/2fe1c1516e1d4076be0882b64dcb8268/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0";
var HALLOWEEN_END = new Date(2026, 10, 2);
var HW = '<style id="hw">'
+ 'body{background:#f8f4fc!important}'
+ '.top{background:linear-gradient(160deg,#120a24 0%,#2a1446 55%,#4a1f5c 100%)!important;position:relative;overflow:hidden}'
+ '.top>*{position:relative;z-index:1}'
+ '.top::before{content:"";position:absolute;right:26px;top:16px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8d6,#f6d77a 60%,#e9b949);box-shadow:0 0 34px 10px rgba(246,215,122,.30);z-index:0}'
+ '.top::after{content:"\uD83E\uDD87";position:absolute;font-size:20px;top:20px;right:96px;z-index:0;animation:hwfly 6s ease-in-out infinite}'
+ '@keyframes hwfly{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(-46px,12px) rotate(8deg)}}'
+ '.avatar{background:#ff7a1a!important;color:#1b0f2e!important}'
+ '.kicker::before{content:"\uD83C\uDF83  "}'
+ '.wrap::before{content:"\uD83C\uDF83  Happy Halloween from Aliado!  \uD83D\uDC7B";display:block;text-align:center;color:#ffd7a3;font-size:.8rem;font-weight:600;letter-spacing:.02em;margin-top:-6px}'
+ '.card{border-color:#ecdff5!important}'
+ '</style>';
var p = new URLSearchParams((location.hash || "").replace(/^#/, ""));
var k = p.get("k"), c = p.get("c");
var msg = document.getElementById("msg");
if (!k || !c) { msg.textContent = "This link is incomplete. Please contact Aliado support."; return; }
var url = BASE + "&sig=" + encodeURIComponent(k) + "&clinician=" + encodeURIComponent(c);
fetch(url, { method: "GET", referrerPolicy: "no-referrer" })
.then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
.then(function (h) {
h = h.split("sun.setDate(now.getDate() - now.getDay());").join("sun.setDate(now.getDate() - ((now.getDay() + 6) % 7));");
if (new Date() < HALLOWEEN_END) { h = h.replace("</head>", HW + "</head>"); }
document.open(); document.write(h); document.close();
})
.catch(function () { msg.textContent = "We couldn't load your billing hours right now. Please try again in a moment."; });
})();
</script>
</body>
</html>
