<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Aliado – Home Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent;font-family:Inter,Arial,sans-serif}
  .wrap{display:flex;flex-direction:column;gap:14px;padding:4px 2px}
  a.btn{display:flex;align-items:center;gap:14px;min-height:88px;padding:14px 16px;border-radius:18px;text-decoration:none;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .12s ease, filter .12s ease;-webkit-tap-highlight-color:transparent}
  a.btn:active{transform:scale(.98);filter:brightness(1.08)}
  a.btn:hover{filter:brightness(1.08)}
  .ic{flex:0 0 auto;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
  .tx{flex:1 1 auto;display:flex;flex-direction:column;gap:4px;min-width:0}
  .t{font-size:18px;font-weight:800;line-height:1.2}
  .d{font-size:13px;color:rgba(255,255,255,.88);line-height:1.35}
  .chev{flex:0 0 auto;opacity:.9}
  .ay{background:#1f3f9e}.bh{background:#0f6b5c}.rs{background:#4a3f6b}
</style>
</head>
<body>
<div class="wrap">
  <a class="btn ay" id="ay" target="_top" href="#">
    <span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
    <span class="tx"><span class="t">My Active Youth</span><span class="d">Assigned youth, referrals and case info</span></span>
    <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>
  <a class="btn bh" id="bh" target="_top" href="#">
    <span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15v3"/><path d="M12 10v8"/><path d="M17 6v12"/></svg></span>
    <span class="tx"><span class="t">My Billing Hours</span><span class="d">Billable hours, productivity and payroll</span></span>
    <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>
  <a class="btn rs" id="rs" target="_top" href="#">
    <span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/></svg></span>
    <span class="tx"><span class="t">Resources</span><span class="d">Agreements, ROI, CFT and discharge forms</span></span>
    <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>
</div>
<script>
  // Links come in the hash: #ay=<url>&bh=<url>&rs=<url> (each URL-encoded)
  var p = new URLSearchParams(location.hash.slice(1));
  ['ay','bh','rs'].forEach(function(k){
    var u = p.get(k), a = document.getElementById(k);
    if (u && /^https:\/\//.test(u)) { a.href = u; } else { a.style.display = 'none'; }
  });
</script>
</body>
</html>
