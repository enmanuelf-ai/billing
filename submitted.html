<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Encounter Submitted</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #F0F2F8; color: #0f1729; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 16px; padding: 36px 28px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 4px 20px rgba(15,23,41,0.08); }
  .check { width: 64px; height: 64px; border-radius: 50%; background: #EDFCF2; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .check svg { width: 32px; height: 32px; }
  h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 8px; }
  p { font-size: 0.92rem; color: #4a5568; line-height: 1.55; }
  .tip { margin-top: 18px; background: #f8f9fc; border: 1px solid #e4e8f0; border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; color: #1a3a8f; font-weight: 600; }
  .brand { margin-top: 22px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #a0aab8; }
</style>
</head>
<body>
  <div class="card">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
    <h1>Encounter submitted</h1>
    <p>Thank you! Your encounter form was received successfully.</p>
    <div class="tip">You can close this tab now.</div>
    <div class="brand">Aliado Community Health</div>
  </div>
<script>
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
</script>
</body>
</html>
