<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Aliado Community Health</title>
<style>
html,body{margin:0;height:100%;background:#fff;font-family:'Segoe UI',Arial,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
img{width:150px;height:150px;animation:p 1.6s ease-in-out infinite}
.t{margin-top:18px;color:#1b2766;font-weight:700;font-size:17px;letter-spacing:.3px}
.s{margin-top:4px;color:#7a84a3;font-size:13px}
.bar{margin-top:18px;width:160px;height:4px;border-radius:4px;background:#e3e8ff;overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:#2f45a8;border-radius:4px;animation:b 1.1s ease-in-out infinite}
@keyframes b{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style></head>
<body><div class="w"><img src="https://www.jotform.com/uploads/enmanuelf59/form_files/Aliado%20Logo.6a445020d28805.86370275.png" alt="Aliado Community Health"><div class="t" id="t">Loading…</div><div class="s" id="s">One moment, please</div><div class="bar" id="bar"><i></i></div></div>
<script>(function(){var h=location.hash.slice(1),u="";h.split("&").forEach(function(p){var i=p.indexOf("=");if(p.slice(0,i)==="u")u=decodeURIComponent(p.slice(i+1));});
var ok=false;try{var x=new URL(u);ok=x.protocol==="https:"&&/(\.environment\.api\.powerplatform\.com|\.logic\.azure\.com)$/.test(x.hostname);}catch(e){}
if(ok){try{history.replaceState(null,"",location.pathname);}catch(e){}setTimeout(function(){location.replace(u);},60);}
else{document.getElementById("t").textContent="Invalid link";document.getElementById("s").textContent="Please contact the office: (201) 620-6440";document.getElementById("bar").style.display="none";}})();</script>
</body></html>
